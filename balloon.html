<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>射氣球 V0.14 局勢壓力版</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;background:#dff3ff;color:#27445b;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
.top{display:flex;gap:8px;padding:8px;background:rgba(255,255,255,.8);backdrop-filter:blur(8px);font-weight:800;align-items:center;justify-content:center;flex-wrap:wrap;z-index:60}
.pill{background:#fff;border-radius:16px;padding:7px 12px;box-shadow:0 2px 8px #7aa7bd33}
.game{position:relative;overflow:hidden;background:linear-gradient(#dff4ff 0 78%,#d8f0d2 78%);touch-action:none;-webkit-touch-callout:none}
.cloud{position:absolute;background:#fff9;border-radius:50px;width:110px;height:34px;filter:blur(.2px);pointer-events:none}
.cloud:before,.cloud:after{content:'';position:absolute;background:#fff9;border-radius:50%}
.cloud:before{width:48px;height:48px;left:18px;top:-22px}.cloud:after{width:58px;height:58px;right:10px;top:-28px}
.legend{position:absolute;right:5px;top:7px;width:92px;background:#ffffffbf;border:1px solid #ffffffcc;border-radius:16px;padding:7px 6px;z-index:20;font-size:11px;line-height:1.32;box-shadow:0 3px 12px #527c9222;pointer-events:none;backdrop-filter:blur(4px)}
.legend b{display:block;text-align:center;margin-bottom:5px;font-size:12px}.legend div{margin:4px 0}.legend .small{font-size:10px;opacity:.78}
.start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:40;background:#dff4ffcc}
.card{background:#fffffff0;padding:22px;border-radius:24px;text-align:center;box-shadow:0 10px 35px #51798c44;max-width:88%}
.card h1{margin:0 0 8px}.btn{border:0;background:#fff;border-radius:18px;padding:12px 24px;font-weight:900;font-size:18px;color:#31546a;box-shadow:0 4px 12px #5d829733}
.balloon{position:absolute;width:76px;height:72px;border-radius:52% 52% 48% 48%;display:flex;align-items:center;justify-content:center;font-weight:1000;font-size:22px;color:#fff;text-shadow:0 2px 3px #0005;box-shadow:inset -8px -10px 14px #0002,inset 9px 9px 14px #fff7,0 5px 8px #56778933;user-select:none;-webkit-user-select:none;z-index:5;will-change:transform;touch-action:none}
.balloon:after{content:'';position:absolute;bottom:-8px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:11px solid currentColor;filter:brightness(.85)}
.gold{background:linear-gradient(135deg,#fff1a7,#d9a820);color:#d9a820}.silver{background:linear-gradient(135deg,#fff,#c9d0d5);color:#b8c0c6}.pink{background:#f38da5;color:#f38da5}.blue{background:#69aee8;color:#69aee8}.green{background:#70c995;color:#70c995}.purple{background:#a78adf;color:#a78adf}.orange{background:#f2a35e;color:#f2a35e}.balloon span{color:white;pointer-events:none}.silver span{color:#586c78;text-shadow:none}.gold span{color:#725511;text-shadow:none}
.pop{position:absolute;font-weight:1000;font-size:22px;z-index:30;pointer-events:none;animation:float .7s forwards}@keyframes float{to{transform:translateY(-40px);opacity:0}}
.msg{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:25;background:#ffffffed;padding:8px 14px;border-radius:18px;font-weight:900;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}.msg.show{opacity:1}
.end{display:none;position:absolute;inset:0;z-index:50;background:#dff4ffee;align-items:center;justify-content:center}.end.show{display:flex}.small{font-size:13px;opacity:.75}
@media(max-width:380px){.legend{width:86px;font-size:10.5px}.balloon{width:72px;height:68px;font-size:21px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="pill">⭐ <span id="score">0</span></div>
    <div class="pill">⏱ <span id="time">60</span> 秒</div>
    <div class="pill">🔫 <span id="ammo">20</span></div>
  </div>
  <div class="game" id="game">
    <div class="cloud" style="left:7%;top:12%"></div>
    <div class="cloud" style="left:45%;top:34%;transform:scale(.7)"></div>
    <div class="legend" id="legend">
      <b>🎈 說明</b>
      <div>彩球：依球面加分</div>
      <div>🟡 🔫?：+2 或空包</div>
      <div>⚪ ⏱+3：加 3 秒</div>
      <div class="small">特殊球不計分</div>
    </div>
    <div class="msg" id="msg"></div>
    <div class="start" id="start"><div class="card"><h1>🎈 射氣球</h1><p>V0.8 全場飛散版｜60 秒・20 發<br>氣球會主動分散到整個畫面</p><button class="btn" id="go">開始測試</button></div></div>
    <div class="end" id="end"><div class="card"><h1>本局結束</h1><p>總分：<b id="final">0</b></p><p class="small" id="stats"></p><button class="btn" id="again">再玩一次</button></div></div>
  </div>
</div>
<script>
(()=>{
const g=document.getElementById('game'), legend=document.getElementById('legend'), scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),ammoEl=document.getElementById('ammo'),msg=document.getElementById('msg');
let score=0,time=60,ammo=20,running=false,balls=[],timer,spawnTimer,shots=0,hits=0,raf=0,lastTs=0,spawnSeq=0;
const colors=['pink','blue','green','purple','orange'];
const scoreWeights=[
  {v:1,w:25},{v:2,w:22},{v:3,w:18},{v:5,w:20},{v:10,w:15}
];
function pickScore(){let r=Math.random()*100;for(const x of scoreWeights){r-=x.w;if(r<0)return x.v}return 1}
function hud(){scoreEl.textContent=score;timeEl.textContent=time;ammoEl.textContent=ammo}
function note(t){msg.textContent=t;msg.classList.add('show');clearTimeout(msg._t);msg._t=setTimeout(()=>msg.classList.remove('show'),900)}
function bounds(){const W=g.clientWidth,H=g.clientHeight;const safe=Math.max(92,legend.offsetWidth+12);return {W,H,right:Math.max(125,W-safe-6),top:4,bottom:H-10}}
function speedFor(type,val,sizeMul){
  // V0.14:刺激靠多目標追逐與取捨，不靠把 +10 做成閃電。
  // +10 仍最難，但只比 +5 快一階；金銀與高分球接近，避免資源球變送分。
  let base,spread;
  if(type==='gold'||type==='silver'){base=242;spread=48}
  else if(val===10){base=270;spread=54}
  else if(val===5){base=242;spread=48}
  else if(val===3){base=218;spread=44}
  else if(val===2){base=188;spread=38}
  else{base=164;spread=34}
  // 尺寸只做輕微速度傾向，不讓「小球 = 必定超高速」。
  const sizeBoost=sizeMul<.8?1.08:(sizeMul<.95?1.03:.98);
  return (base+Math.random()*spread)*sizeBoost;
}
function pickSize(){
  // 所有分數與特殊球都共用同一尺寸池，分數不綁尺寸。
  const r=Math.random();
  if(r<.22)return .70;
  if(r<.62)return .86;
  return 1.0;
}
function spawn(force=false){
  if(!running)return;if(balls.length>=16&&!force)return;
  const {H,right}=bounds();
  const b=document.createElement('div');b.className='balloon';
  let type='score',label,val=0;const r=Math.random();
  const goldOn=balls.some(o=>!o.dead&&o.type==='gold'), silverOn=balls.some(o=>!o.dead&&o.type==='silver');
  const scoreCount=balls.filter(o=>!o.dead&&o.type==='score').length;
  if(scoreCount>=8 && r<.04 && !goldOn){type='gold';b.classList.add('gold');label='🔫 ?'}
  else if(scoreCount>=8 && r<.08 && !silverOn){type='silver';b.classList.add('silver');label='⏱ +3'}
  else{val=pickScore();b.classList.add(colors[Math.floor(Math.random()*colors.length)]);label='+'+val}
  b.innerHTML='<span>'+label+'</span>';
  const sizeMul=pickSize();
  b.style.width=(76*sizeMul)+'px';b.style.height=(72*sizeMul)+'px';
  b.style.fontSize=(22*Math.max(.76,sizeMul))+'px';
  g.appendChild(b);
  const bw=b.offsetWidth||76,bh=b.offsetHeight||72;
  // Rotate entry sides with a shuffled offset so all four edges stay active.
  const side=(spawnSeq++ + Math.floor(Math.random()*2))%4,s=speedFor(type,val,sizeMul);
  const yMin=28,yMax=Math.max(100,H-bh-24),xMax=Math.max(70,right-bw);
  let x,y;
  if(side===0){x=-bw-8;y=yMin+Math.random()*(yMax-yMin)}
  else if(side===1){x=right+10;y=yMin+Math.random()*(yMax-yMin)}
  else if(side===2){x=Math.random()*xMax;y=-bh-10}
  else{x=Math.random()*xMax;y=H+10}

  // V0.8: don't let the whole flock drift into one band. Aim each new balloon toward
  // a lightly occupied height zone, while still giving every balloon its own diagonal path.
  const zones=[0,0,0];
  const usableH=Math.max(180,H-bh-40);
  for(const o of balls){
    const cy=Math.max(0,Math.min(usableH,o.y+36));
    zones[Math.min(2,Math.floor(cy/(usableH/3)))]++;
  }
  const minCount=Math.min(...zones);
  const candidates=zones.map((n,i)=>n===minCount?i:-1).filter(i=>i>=0);
  const zone=candidates[Math.floor(Math.random()*candidates.length)];
  const targetY=30+(zone+0.15+Math.random()*0.70)*(usableH/3);
  const targetX=18+Math.random()*Math.max(60,xMax-18);
  let dx=targetX-x,dy=targetY-y;
  let angle=Math.atan2(dy,dx);
  // Add a modest random fan so paths aren't mechanical, but keep the empty-zone bias.
  angle+=(Math.random()-.5)*0.55;
  let vx=Math.cos(angle)*s,vy=Math.sin(angle)*s;
  const obj={b,type,val,dead:false,x,y,vx,vy,phase:Math.random()*Math.PI*2,wobble:4+Math.random()*5,
    steer:(Math.random()<.5?-1:1)*(0.14+Math.random()*0.24),age:0,bounces:0,retarget:.82+Math.random()*1.08,sizeMul,
    speedPhase:Math.random()*Math.PI*2,speedRate:1.35+Math.random()*1.25,baseSpeed:s};
  b.style.transform=`translate3d(${x}px,${y}px,0)`;balls.push(obj);
  b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();shoot(obj,e.clientX,e.clientY)});
}
function remove(o){if(o.dead)return;o.dead=true;o.b.remove();balls=balls.filter(x=>x!==o)}
function motion(ts){
  if(!running)return;const dt=Math.min(.034,(ts-(lastTs||ts))/1000);lastTs=ts;const {H,right}=bounds();
  for(const o of [...balls]){
    if(o.dead)continue;
    o.age+=dt;o.phase+=dt*2.7;o.retarget-=dt;o.speedPhase+=dt*o.speedRate;

    // V0.12: no sudden burst/teleport feeling. Valuable targets stay fast, but accelerate/decelerate continuously.
    let pulse=0;
    if(o.type!=='score') pulse=.10+.10*(.5+.5*Math.sin(o.speedPhase));
    else if(o.val===10) pulse=.07+.10*(.5+.5*Math.sin(o.speedPhase));
    else if(o.val===5) pulse=.05+.08*(.5+.5*Math.sin(o.speedPhase));
    else if(o.val===3) pulse=.03+.06*(.5+.5*Math.sin(o.speedPhase));
    const desiredSpeed=o.baseSpeed*(1+pulse);
    const currentSpeed=Math.max(1,Math.hypot(o.vx,o.vy));
    const blend=Math.min(1,dt*3.8);
    const newSpeed=currentSpeed+(desiredSpeed-currentSpeed)*blend;
    o.vx=o.vx/currentSpeed*newSpeed;o.vy=o.vy/currentSpeed*newSpeed;

    // Periodically bias toward a less occupied vertical third, but turn gradually enough to remain readable.
    if(o.retarget<=0){
      const thirds=[0,0,0],usable=Math.max(180,H-90);
      for(const q of balls){if(q.dead)continue;const yy=Math.max(0,Math.min(usable,q.y+36));thirds[Math.min(2,Math.floor(yy/(usable/3)))]++;}
      const m=Math.min(...thirds),cs=thirds.map((n,i)=>n===m?i:-1).filter(i=>i>=0),z=cs[Math.floor(Math.random()*cs.length)];
      const ty=24+(z+0.2+Math.random()*0.6)*(usable/3),tx=20+Math.random()*Math.max(50,right-110);
      const desired=Math.atan2(ty-o.y,tx-o.x),cur=Math.atan2(o.vy,o.vx);
      let diff=((desired-cur+Math.PI*3)%(Math.PI*2))-Math.PI;
      diff=Math.max(-0.58,Math.min(0.58,diff));
      const sp=Math.hypot(o.vx,o.vy),a=cur+diff*0.32;o.vx=Math.cos(a)*sp;o.vy=Math.sin(a)*sp;
      o.retarget=.90+Math.random()*1.20;
    }

    const turn=o.steer*dt;
    const c=Math.cos(turn),sn=Math.sin(turn),nvx=o.vx*c-o.vy*sn,nvy=o.vx*sn+o.vy*c;
    o.vx=nvx;o.vy=nvy;
    o.x+=o.vx*dt;o.y+=o.vy*dt;
    const drawX=o.x+Math.cos(o.phase*.83)*o.wobble*.45;
    const drawY=o.y+Math.sin(o.phase)*o.wobble;
    o.b.style.transform=`translate3d(${drawX}px,${drawY}px,0)`;
    const bw=o.b.offsetWidth||76,bh=o.b.offsetHeight||72;

    // Low-value balloons may bounce once; valuable targets mostly cross the field and escape.
    if(o.age>.52 && o.bounces<1 && !(o.type!=='score'||o.val>=5)){
      let bounced=false;
      if(o.x<0 && o.vx<0){o.x=0;o.vx=Math.abs(o.vx);bounced=true}
      else if(o.x>right-bw && o.vx>0){o.x=right-bw;o.vx=-Math.abs(o.vx);bounced=true}
      if(o.y<0 && o.vy<0){o.y=0;o.vy=Math.abs(o.vy);bounced=true}
      else if(o.y>H-bh-6 && o.vy>0){o.y=H-bh-6;o.vy=-Math.abs(o.vy);bounced=true}
      if(bounced)o.bounces++;
    }
    if(o.x<-bw-38||o.x>right+42||o.y<-bh-42||o.y>H+42) remove(o);
  }
  raf=requestAnimationFrame(motion);
}

function shoot(o,cx,cy){
  if(!running||o.dead||ammo<=0)return;shots++;ammo--;hits++;let text='';
  if(o.type==='score'){score+=o.val;text='+'+o.val}
  else if(o.type==='gold'){if(Math.random()<.55){ammo+=2;text='🔫 +2';note('補到 2 發子彈！')}else{text='💨 空包';note('空包！')}}
  else{time+=3;text='⏱ +3';note('時間 +3 秒！')}
  const rect=g.getBoundingClientRect(),p=document.createElement('div');p.className='pop';p.textContent=text;p.style.left=(cx-rect.left-20)+'px';p.style.top=(cy-rect.top-20)+'px';g.appendChild(p);setTimeout(()=>p.remove(),750);remove(o);hud();if(ammo<=0)note('子彈用完，等時間結束')
}
function missShot(cx,cy){
  if(!running||ammo<=0)return;
  shots++;ammo--;
  const rect=g.getBoundingClientRect(),p=document.createElement('div');p.className='pop';p.textContent='MISS';
  p.style.left=(cx-rect.left-20)+'px';p.style.top=(cy-rect.top-20)+'px';p.style.opacity='.72';g.appendChild(p);setTimeout(()=>p.remove(),520);
  hud();if(ammo<=0)note('子彈用完，等時間結束');
}
g.addEventListener('pointerdown',e=>{
  if(!running)return;
  if(e.target.closest('.balloon'))return;
  e.preventDefault();missShot(e.clientX,e.clientY);
});

function begin(){
  balls.forEach(remove);score=0;time=60;ammo=20;shots=hits=0;spawnSeq=Math.floor(Math.random()*4);running=true;lastTs=0;hud();
  document.getElementById('start').style.display='none';document.getElementById('end').classList.remove('show');
  for(let i=0;i<9;i++)setTimeout(()=>spawn(true),i*150);
  clearInterval(timer);clearInterval(spawnTimer);cancelAnimationFrame(raf);raf=requestAnimationFrame(motion);
  timer=setInterval(()=>{time--;hud();if(time<=0)finish()},1000);
  spawnTimer=setInterval(()=>{if(!running)return;if(balls.length<9){spawn();setTimeout(()=>spawn(),100)}else if(balls.length<13){if(Math.random()<.98)spawn()}else if(balls.length<16&&Math.random()<.72)spawn()},300);
}
function finish(){
  if(!running)return;running=false;clearInterval(timer);clearInterval(spawnTimer);cancelAnimationFrame(raf);balls.forEach(remove);
  document.getElementById('final').textContent=score;const misses=Math.max(0,shots-hits),rate=shots?Math.round(hits/shots*100):0;document.getElementById('stats').textContent=`射擊 ${shots} 發｜命中 ${hits}｜MISS ${misses}｜命中率 ${rate}%｜剩餘 ${ammo} 發`;document.getElementById('end').classList.add('show')
}
// Mobile game: suppress browser zoom/gesture handling without changing gameplay.
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{
  const now=Date.now();
  if(now-lastTouchEnd<=300)e.preventDefault();
  lastTouchEnd=now;
},{passive:false});

document.getElementById('go').onclick=begin;document.getElementById('again').onclick=begin;hud();
})();
</script>
</body>
</html>
