<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>歡迎來到遊戲活動中心</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#f9f1f7}
body{overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}

.portal{
  position:relative;
  width:100vw;
  height:100svh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(180deg,#dff0ff 0%,#f7eef9 58%,#fff1f6 100%);
}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;display:block}
.art.mobile{display:none}

/* only two small independent animation balloons; no masks, no repainting */
.sprite{position:absolute;z-index:8;pointer-events:none;will-change:transform;filter:drop-shadow(0 8px 13px rgba(78,112,160,.10))}
.sprite svg{display:block;width:100%;height:auto;overflow:visible}
.pink-float{width:7.2%;left:4%;top:13%;animation:floatA 8s ease-in-out infinite}
.blue-star{width:7.2%;right:5%;top:39%;animation:floatB 9.4s ease-in-out infinite -3.3s}

.spark{position:absolute;z-index:9;color:#fff;text-shadow:0 0 12px #fff;pointer-events:none;animation:twinkle 3.4s ease-in-out infinite}
.s1{left:27%;top:12%;font-size:20px}
.s2{right:27%;top:15%;font-size:17px;animation-delay:1.1s}
.s3{left:20%;top:43%;font-size:15px;animation-delay:2s}

.enter{
  position:absolute;z-index:20;
  left:25.5%;top:54.2%;width:49%;height:15.5%;
  border-radius:999px;text-decoration:none;
  -webkit-tap-highlight-color:transparent;
}
.enter::after{
  content:"";position:absolute;inset:-4px;border-radius:inherit;
  animation:glow 3.6s ease-in-out infinite;
}

@keyframes floatA{
  0%,100%{transform:translate3d(0,0,0) rotate(-1deg)}
  50%{transform:translate3d(8px,-16px,0) rotate(2deg)}
}
@keyframes floatB{
  0%,100%{transform:translate3d(0,0,0) rotate(1deg)}
  50%{transform:translate3d(-7px,-14px,0) rotate(-2deg)}
}
@keyframes twinkle{
  0%,100%{opacity:.16;transform:scale(.78)}
  50%{opacity:.95;transform:scale(1.16)}
}
@keyframes glow{
  0%,100%{box-shadow:0 0 0 rgba(255,255,255,0)}
  50%{box-shadow:0 0 24px rgba(255,255,255,.25)}
}

/* PHONE PORTRAIT: use the locked portrait artwork and fill the screen without blank bottom. */
@media (orientation:portrait) and (max-width:700px){
  body{overflow:auto;background:#fff1f6}
  .portal{
    width:100vw;
    height:auto;
    min-height:0;
    display:block;
    overflow:hidden;
    background:#fff1f6;
  }
  .art.desktop{display:none}
  .art.mobile{
    display:block;
    position:relative;
    width:100vw;
    height:auto;
    object-fit:initial;
  }
.pink-float{width:11.5%;left:2%;top:14%}
  .blue-star{width:10%;right:3%;top:36%}
  .s1{left:27%;top:8%;font-size:16px}
  .s2{right:24%;top:14%;font-size:14px}
  .s3{left:10%;top:33%;font-size:13px}
  .enter{left:21.8%;top:43.6%;width:56.5%;height:9.4%}
}

/* TABLET / LANDSCAPE: keep the entire wide artwork inside one visible screen. */
@media (orientation:landscape){
  .portal{height:100svh;min-height:0}
  .art.desktop{
    display:block;
    position:absolute;
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
  }
  .art.mobile{display:none}
}
@media(prefers-reduced-motion:reduce){
  .sprite,.spark,.enter::after{animation:none!important}
}
</style>
</head>
