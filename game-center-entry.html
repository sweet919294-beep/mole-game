<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>歡迎來到遊戲活動中心</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#f7f0f6;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
body{overflow-x:hidden}
.portal{position:relative;width:100%;max-width:691px;margin:0 auto;line-height:0}
.art{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.enter-hit{position:absolute;left:15.2%;top:47.2%;width:69.5%;height:9.2%;border-radius:999px;z-index:5;-webkit-tap-highlight-color:transparent}
.cloud-secret{position:absolute;left:43.2%;top:5.7%;width:13.8%;height:8.8%;z-index:8;border-radius:50%;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none}
.lock-toast{position:fixed;z-index:80;left:50%;bottom:9vh;transform:translateX(-50%) translateY(20px);padding:12px 18px;border-radius:999px;background:rgba(55,65,81,.92);color:white;font-size:15px;line-height:1.4;opacity:0;pointer-events:none;transition:.22s;white-space:nowrap;box-shadow:0 10px 28px rgba(0,0,0,.18)}
.lock-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(32,42,64,.34);display:none;align-items:center;justify-content:center;padding:22px;backdrop-filter:blur(5px)}
.overlay.show{display:flex}
.card{width:min(92vw,390px);background:rgba(255,255,255,.97);border-radius:26px;padding:24px;box-shadow:0 24px 70px rgba(32,42,64,.25);line-height:1.45;color:#596579}
.card h2{margin:0 0 8px;font-size:23px;color:#52657a}
.card p{margin:0 0 16px;font-size:14px;color:#8a94a3}
.field{width:100%;border:1px solid #dce5ee;border-radius:14px;padding:13px 14px;font-size:16px;outline:none;margin:7px 0;background:#fbfdff}
.field:focus{border-color:#9bc9ec;box-shadow:0 0 0 3px rgba(155,201,236,.18)}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border:0;border-radius:14px;padding:12px 14px;font-size:15px;font-weight:700;cursor:pointer}
.btn.main{background:linear-gradient(135deg,#80c8f0,#eba7ca);color:#fff}
.btn.soft{background:#eef3f7;color:#667487}
.status{display:flex;align-items:center;justify-content:space-between;margin:12px 0 4px;padding:13px 14px;border-radius:16px;background:#f6f9fb;font-size:15px}
.badge{padding:6px 10px;border-radius:999px;font-weight:800;font-size:13px}
.badge.open{background:#e5f7f0;color:#3b9b7d}
.badge.closed{background:#fde8ed;color:#c75f79}
.admin-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.admin-actions button{border:0;border-radius:16px;padding:14px 10px;font-size:15px;font-weight:800}
.open-btn{background:#dff5ec;color:#348d73}
.close-btn{background:#fde4eb;color:#bb5871}
.small{font-size:12px!important;color:#9aa3af!important;margin-top:14px!important}
.msg{min-height:20px;color:#c65d78;font-size:13px;margin-top:6px}
@media(min-width:692px){body{display:flex;justify-content:center}}
</style>
</head>

    authDomain: "mole-game-3073f.firebaseapp.com",
    databaseURL: "https://mole-game-3073f-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "mole-game-3073f",
    storageBucket: "mole-game-3073f.firebasestorage.app",
    messagingSenderId: "942915688837",
    appId: "1:942915688837:web:4e6584ad32100b2cc24cec"
  };

  const MASTER_EMAIL = "sweet919294@gmail.com";
  const MASTER_UID = "CsJssZzlp4PkPEnXk8FxyOyc2pk1";
  const $ = id => document.getElementById(id);

  let portalOpen = false;
  let firebaseReady = false;
  let app, auth, db, openRef;

  function showToast(t, ms=1800){
    const el=$('toast');
    el.textContent=t;
    el.classList.add('show');
    clearTimeout(showToast.t);
    showToast.t=setTimeout(()=>el.classList.remove('show'),ms);
  }

  function renderStatus(){
    const b=$('statusBadge');
    b.textContent = firebaseReady ? (portalOpen ? '活動開放' : '活動關閉') : '連線中';
    b.className='badge '+(firebaseReady && portalOpen ? 'open' : 'closed');
  }

  async function initFirebase(){
    try{
      app = firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.database();
      openRef = db.ref('gameCenter/control/open');

      openRef.on('value', snap => {
        firebaseReady = true;
        portalOpen = snap.val() === true;
        renderStatus();
      }, err => {
        firebaseReady = false;
        renderStatus();
        showToast('Firebase 讀取失敗',2400);
        console.error(err);
      });
    }catch(err){
      firebaseReady = false;
      renderStatus();
      showToast('Firebase 連線失敗',2400);
      console.error(err);
    }
  }

  $('enterHit').addEventListener('click',e=>{
    if(!firebaseReady){
      e.preventDefault();
      showToast('正在確認活動狀態');
      return;
    }
    if(!portalOpen){
      e.preventDefault();
      showToast('活動尚未開放');
    }
  });

  let holdTimer=null;
  function beginHold(e){
    e.preventDefault();
    clearTimeout(holdTimer);
    holdTimer=setTimeout(openLogin,2000);
  }
  function endHold(){clearTimeout(holdTimer);holdTimer=null}
  const cloud=$('cloudSecret');
  ['pointerdown','touchstart'].forEach(n=>cloud.addEventListener(n,beginHold,{passive:false}));
  ['pointerup','pointercancel','pointerleave','touchend','touchcancel'].forEach(n=>cloud.addEventListener(n,endHold));
  cloud.addEventListener('contextmenu',e=>e.preventDefault());

  function openLogin(){
    $('loginTitle').textContent='主控登入';
    $('loginDesc').textContent='請輸入 Firebase 主控密碼。';
    $('passwordConfirm').style.display='none';
    $('passwordInput').value='';
    $('loginMsg').textContent='';
    $('loginOverlay').classList.add('show');
    setTimeout(()=>$('passwordInput').focus(),80);
  }
  function closeLogin(){$('loginOverlay').classList.remove('show')}
  $('cancelLogin').onclick=closeLogin;

  $('submitLogin').onclick=async()=>{
    const password=$('passwordInput').value;
    if(!password){$('loginMsg').textContent='請輸入主控密碼';return}
    if(!auth){$('loginMsg').textContent='Firebase 尚未連線';return}

    $('submitLogin').disabled=true;
    $('loginMsg').textContent='驗證中…';
    try{
      const cred=await auth.signInWithEmailAndPassword(MASTER_EMAIL,password);
      if(!cred.user || cred.user.uid!==MASTER_UID){
        await auth.signOut();
        throw new Error('UID_MISMATCH');
      }

      // First successful master login creates the shared gate in the safest state.
      const snap=await openRef.once('value');
      if(!snap.exists()){
        await openRef.set(false);
      }

      closeLogin();
      $('loginMsg').textContent='';
      $('adminOverlay').classList.add('show');
      renderStatus();
    }catch(err){
      console.error(err);
      $('loginMsg').textContent='主控密碼不正確，或 Firebase 驗證失敗';
    }finally{
      $('submitLogin').disabled=false;
    }
  };

  async function setOpen(v){
    if(!auth || !auth.currentUser || auth.currentUser.uid!==MASTER_UID){
      showToast('主控驗證已失效，請重新登入',2400);
      $('adminOverlay').classList.remove('show');
      return;
    }
    try{
      await openRef.set(!!v);
      showToast(v?'活動中心已開放':'活動中心已關閉');
    }catch(err){
      console.error(err);
      showToast('寫入失敗，Firebase 已拒絕操作',2600);
    }
  }

  $('openPortal').onclick=()=>setOpen(true);
  $('closePortal').onclick=()=>setOpen(false);
  $('closeAdmin').onclick=()=> $('adminOverlay').classList.remove('show');

  $('changePassword').onclick=async()=>{
    if(!auth || !auth.currentUser || auth.currentUser.uid!==MASTER_UID){
      showToast('請重新登入主控');
      return;
    }
    const next=prompt('輸入新的 Firebase 主控密碼（至少 6 碼）');
    if(next===null)return;
    if(next.length<6){alert('密碼至少 6 碼');return}
    const again=prompt('再次輸入新的 Firebase 主控密碼');
    if(next!==again){alert('兩次密碼不一致');return}
    try{
      await auth.currentUser.updatePassword(next);
      alert('Firebase 主控密碼已更新');
    }catch(err){
      console.error(err);
      alert('密碼更新失敗；若登入時間過久，請關閉主控後重新登入再試。');
    }
  };

  renderStatus();
  initFirebase();
})();
</script>
<script id="lobbyMusicIntentScript">
document.getElementById('enterHit')?.addEventListener('click',()=>{
  sessionStorage.setItem('gameCenterLobbyMusic','1');
},{capture:true});
</script>
</body>
</html>
