<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小豬打地鼠樂園・測試版</title>
<style>
:root{
  --cream:#fff7d8;
  --sky:#dff3fb;
  --pink:#ef7fa7;
  --pink2:#ffd5e3;
  --green:#dff0ae;
  --green2:#a8d48c;
  --brown:#8b5b47;
  --text:#624b54;
  --card:#fffef9;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  color:var(--text);
  background:linear-gradient(180deg,var(--sky) 0 22%,var(--cream) 22% 100%);
}
.wrap{width:min(920px,94vw);margin:0 auto;padding:18px 0 40px}
.hero{
  text-align:center;
  padding:18px 12px;
  background:rgba(255,255,255,.55);
  border:2px solid rgba(255,255,255,.9);
  border-radius:28px;
}
.hero h1{margin:0;color:#d85f89;font-size:clamp(28px,6vw,44px)}
.hero p{margin:6px 0 0;font-size:15px}
.card{
  background:var(--card);
  border:2px solid #eadfbf;
  border-radius:24px;
  padding:16px;
  margin-top:14px;
}
.name{
  width:100%;
  border:2px solid #b8dce9;
  border-radius:16px;
  padding:13px 14px;
  font-size:18px;
}
.label{font-weight:900;margin:16px 0 8px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.choice{
  min-height:70px;
  border:2px solid #ddd4bf;
  background:#fff;
  border-radius:18px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}
.choice b{display:block;font-size:23px;margin-bottom:3px}
.choice.selected{border-color:var(--pink);background:#fff0f5;color:#c95179}
.start,.again{
  width:100%;min-height:52px;border:0;border-radius:17px;
  background:#e96794;color:#fff;font-size:19px;font-weight:900;
  margin-top:14px;cursor:pointer;
}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:#f6fbfd;border:2px solid #c9e4ed;border-radius:15px;padding:9px 4px;text-align:center}
.stat small{display:block;font-size:12px;color:#7a878d}.stat strong{font-size:22px;color:#cb527a}
.status{background:#fff2c7;border-radius:14px;padding:9px;text-align:center;font-weight:900;color:#8d6928;margin-bottom:10px}
.board{
  display:grid;gap:8px;
  background:var(--green);
  border:3px solid var(--green2);
  border-radius:24px;padding:10px;
}
.board.c6,.board.c9{grid-template-columns:repeat(3,1fr)}
.board.c12{grid-template-columns:repeat(4,1fr)}
.hole{
  aspect-ratio:1;
  border:0;border-radius:50%;
  background:var(--brown);
  box-shadow:inset 0 7px 0 rgba(0,0,0,.14);
  display:flex;align-items:flex-end;justify-content:center;
  overflow:hidden;cursor:pointer;padding:0;position:relative;
}
.pig-svg{width:94%;height:94%;display:block;pointer-events:none}
.legend{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:13px;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend svg{width:28px;height:28px}
.result{margin-top:12px;padding:14px;border:2px solid #f1bfd0;background:#fff0f5;border-radius:18px;text-align:center}
.result strong{display:block;color:#d85d88;font-size:34px;margin:4px}
.hidden{display:none!important}
.rank h3{margin:0 0 8px;color:#c84f78}
.row{display:flex;justify-content:space-between;gap:8px;padding:9px 3px;border-bottom:1px solid #eee2ca}
.row:last-child{border-bottom:0}
.tag{font-size:11px;background:#f3efe5;padding:2px 7px;border-radius:10px;color:#74666c}
.note{font-size:12px;color:#85767c;text-align:center;margin-top:8px}
@media(max-width:520px){
  .wrap{width:min(96vw,920px)}
  .card{padding:12px}
  .choice{min-height:64px;font-size:12px}
  .board{gap:6px;padding:8px}
}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <h1>🐷 小豬打地鼠樂園</h1>
    <p>選格數、選速度，隨時開始挑戰自己的最高分！</p>
  </section>

  <section id="setup" class="card">
    <input id="name" class="name" maxlength="10" placeholder="輸入小朋友的名字">
    <div class="label">① 選格數</div>
    <div class="choices">
      <button class="choice cells" data-cells="6" type="button"><b>🐣</b>6 格<br>簡單</button>
      <button class="choice cells selected" data-cells="9" type="button"><b>🐷</b>9 格<br>普通</button>
      <button class="choice cells" data-cells="12" type="button"><b>⭐</b>12 格<br>挑戰</button>
    </div>
    <div class="label">② 選速度</div>
    <div class="choices">
      <button class="choice speed" data-ms="1300" data-mode="慢" type="button"><b>🐢</b>慢慢玩</button>
      <button class="choice speed selected" data-ms="900" data-mode="普通" type="button"><b>🐷</b>普通</button>
      <button class="choice speed" data-ms="600" data-mode="快" type="button"><b>🚀</b>快快玩</button>
    </div>
    <button id="start" class="start" type="button">開始遊戲！</button>
  </section>

  <section id="game" class="card hidden">
    <div class="stats">
      <div class="stat"><small>玩家</small><strong id="who">小豬</strong></div>
      <div class="stat"><small>本局</small><strong id="score">0</strong></div>
      <div class="stat"><small>時間</small><strong id="time">30</strong></div>
    </div>
    <div id="status" class="status">準備開始</div>
    <div id="board" class="board c9"></div>
    <div class="legend" id="legend"></div>
    <div id="result" class="result hidden">
      <div>🎉 挑戰完成！</div>
      <strong><span id="final">0</span> 分</strong>
      <div id="settingText"></div>
      <button id="again" class="again" type="button">再玩一次</button>
    </div>
  </section>

  <section class="card rank">
    <h3>🏆 小豬高手榜</h3>
    <div id="rankRows">
      <div class="row"><span>還沒有成績</span><strong>—</strong></div>
    </div>
    <div class="note">這個 test.html 使用獨立測試排行榜，不影響正式版。</div>
  </section>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDlO-SmVwkR4IZnzmVEA9wNfS983DzlxLU",
  authDomain: "mole-game-3073f.firebaseapp.com",
  databaseURL: "https://mole-game-3073f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mole-game-3073f",
  storageBucket: "mole-game-3073f.firebasestorage.app",
  messagingSenderId: "942915688837",
  appId: "1:942915688837:web:4e6584ad32100b2cc24cec"
};
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const app = firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const TEST_ROOT = "pig_test_v2";

function normalPig(){
return `<svg class="pig-svg" viewBox="0 0 120 120" aria-hidden="true">
<ellipse cx="60" cy="82" rx="43" ry="37" fill="#f7a8bd"/>
<path d="M27 55 Q16 34 36 31 Q44 43 42 55Z" fill="#f19ab3"/>
<path d="M93 55 Q104 34 84 31 Q76 43 78 55Z" fill="#f19ab3"/>
<ellipse cx="60" cy="74" rx="33" ry="29" fill="#ffc0d0"/>
<path d="M43 70 Q49 78 55 70" fill="none" stroke="#623d46" stroke-width="4" stroke-linecap="round"/>
<path d="M65 70 Q71 78 77 70" fill="none" stroke="#623d46" stroke-width="4" stroke-linecap="round"/>
<ellipse cx="60" cy="84" rx="15" ry="11" fill="#ed7fa2"/>
<circle cx="54" cy="83" r="2.7" fill="#7d4354"/><circle cx="66" cy="83" r="2.7" fill="#7d4354"/>
<path d="M51 98 Q60 106 69 98" fill="none" stroke="#8b4056" stroke-width="3.5" stroke-linecap="round"/>
<circle cx="39" cy="87" r="7" fill="#f68fae" opacity=".5"/><circle cx="81" cy="87" r="7" fill="#f68fae" opacity=".5"/>
</svg>`;
}
function goldPig(){
return `<svg class="pig-svg" viewBox="0 0 120 120" aria-hidden="true">
<ellipse cx="60" cy="82" rx="43" ry="37" fill="#f6c74d"/>
<path d="M27 55 Q16 34 36 31 Q44 43 42 55Z" fill="#f0b72d"/>
<path d="M93 55 Q104 34 84 31 Q76 43 78 55Z" fill="#f0b72d"/>
<path d="M42 30 L49 15 L59 26 L69 13 L78 30 Z" fill="#ffd84d" stroke="#d59a18" stroke-width="3"/>
<circle cx="49" cy="16" r="3" fill="#fff2a1"/><circle cx="69" cy="14" r="3" fill="#fff2a1"/>
<ellipse cx="60" cy="74" rx="33" ry="29" fill="#ffdb67"/>
<path d="M43 70 Q49 78 55 70" fill="none" stroke="#6a4b2d" stroke-width="4" stroke-linecap="round"/>
<path d="M65 70 Q71 78 77 70" fill="none" stroke="#6a4b2d" stroke-width="4" stroke-linecap="round"/>
<ellipse cx="60" cy="84" rx="15" ry="11" fill="#ef9f28"/>
<circle cx="54" cy="83" r="2.7" fill="#7a4a22"/><circle cx="66" cy="83" r="2.7" fill="#7a4a22"/>
<path d="M51 98 Q60 106 69 98" fill="none" stroke="#8d5e22" stroke-width="3.5" stroke-linecap="round"/>
</svg>`;
}
function rascalPig(){
return `<svg class="pig-svg" viewBox="0 0 120 120" aria-hidden="true">
<ellipse cx="60" cy="82" rx="43" ry="37" fill="#f3a4bb"/>
<path d="M27 55 Q16 34 36 31 Q44 43 42 55Z" fill="#ed95af"/>
<path d="M93 55 Q104 34 84 31 Q76 43 78 55Z" fill="#ed95af"/>
<ellipse cx="60" cy="74" rx="33" ry="29" fill="#ffbed0"/>
<path d="M31 58 Q60 43 89 58 L86 75 Q60 67 34 75Z" fill="#2d2d35"/>
<path d="M35 59 L25 52 L28 65Z" fill="#2d2d35"/>
<path d="M43 65 Q49 73 55 65" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<circle cx="72" cy="65" r="6" fill="#fff"/><circle cx="72" cy="65" r="2.6" fill="#333"/>
<ellipse cx="60" cy="84" rx="15" ry="11" fill="#e97b9e"/>
<circle cx="54" cy="83" r="2.7" fill="#783f50"/><circle cx="66" cy="83" r="2.7" fill="#783f50"/>
<path d="M52 99 Q60 105 68 99" fill="none" stroke="#873e52" stroke-width="3.5" stroke-linecap="round"/>
</svg>`;
}
const pigHTML={normal:normalPig(),gold:goldPig(),bad:rascalPig()};
const setup=document.getElementById("setup"), game=document.getElementById("game"), board=document.getElementById("board");
const nameInput=document.getElementById("name"), who=document.getElementById("who"), scoreEl=document.getElementById("score"), timeEl=document.getElementById("time");
const statusEl=document.getElementById("status"), result=document.getElementById("result"), finalEl=document.getElementById("final"), settingText=document.getElementById("settingText");
let cells=9, spawnMs=900, speedMode="普通", score=0, active=-1, kind="normal", running=false;
let gameTimer=null, spawnTimer=null, countTimer=null;

document.querySelectorAll(".cells").forEach(btn=>btn.addEventListener("click",()=>{
  document.querySelectorAll(".cells").forEach(x=>x.classList.remove("selected"));
  btn.classList.add("selected"); cells=Number(btn.dataset.cells);
}));
document.querySelectorAll(".speed").forEach(btn=>btn.addEventListener("click",()=>{
  document.querySelectorAll(".speed").forEach(x=>x.classList.remove("selected"));
  btn.classList.add("selected"); spawnMs=Number(btn.dataset.ms); speedMode=btn.dataset.mode;
}));

function makeBoard(){
  board.innerHTML=""; board.className="board c"+cells;
  for(let i=0;i<cells;i++){
    const b=document.createElement("button"); b.type="button"; b.className="hole";
    b.addEventListener("click",()=>hit(i,b)); board.appendChild(b);
  }
}
function clearPig(){[...board.children].forEach(x=>x.innerHTML="");active=-1;}
function spawn(){
  if(!running)return;
  clearPig(); active=Math.floor(Math.random()*cells);
  const r=Math.random(); kind=r<.12?"gold":r<.23?"bad":"normal";
  board.children[active].innerHTML=pigHTML[kind];
}
function hit(i,b){
  if(!running||i!==active)return;
  score+=kind==="gold"?3:kind==="bad"?-2:1;
  scoreEl.textContent=score;
  b.innerHTML=`<div style="font-size:clamp(26px,7vw,42px);padding-bottom:20%">💗</div>`;
  active=-1;
  setTimeout(()=>{if(running)spawn();},120);
}
function finish(){
  running=false; clearInterval(gameTimer); clearInterval(spawnTimer); clearPig();
  statusEl.textContent="時間到！";
  finalEl.textContent=score;
  settingText.textContent=`${cells} 格・${speedMode}速度`;
  result.classList.remove("hidden");
  saveScore();
}
function begin(){
  clearInterval(gameTimer); clearInterval(spawnTimer); clearInterval(countTimer);
  running=false; score=0; scoreEl.textContent="0"; timeEl.textContent="30"; result.classList.add("hidden");
  who.textContent=nameInput.value.trim()||"小豬"; makeBoard();
  setup.classList.add("hidden"); game.classList.remove("hidden");
  let c=4; statusEl.textContent=`${c} 秒後開始！`;
  countTimer=setInterval(()=>{
    c--;
    if(c>0) statusEl.textContent=`${c} 秒後開始！`;
    else{
      clearInterval(countTimer); statusEl.textContent=`GO！　${cells}格・${speedMode}`;
      running=true; spawn(); spawnTimer=setInterval(spawn,spawnMs);
      let t=30;
      gameTimer=setInterval(()=>{t--;timeEl.textContent=t;if(t<=0)finish();},1000);
    }
  },700);
}
document.getElementById("start").addEventListener("click",begin);
document.getElementById("again").addEventListener("click",()=>{
  clearInterval(gameTimer);clearInterval(spawnTimer);clearInterval(countTimer);running=false;
  game.classList.add("hidden");setup.classList.remove("hidden");
});

document.getElementById("legend").innerHTML=
  `<span>${normalPig().replace('class="pig-svg"','style="width:28px;height:28px"')} +1</span>`+
  `<span>${goldPig().replace('class="pig-svg"','style="width:28px;height:28px"')} +3</span>`+
  `<span>${rascalPig().replace('class="pig-svg"','style="width:28px;height:28px"')} −2</span>`;

function safeKey(s){return (s||"小豬").trim().slice(0,10).replace(/[.#$/\[\]]/g,"_")||"小豬";}
function saveScore(){
  const display=who.textContent;
  const key=safeKey(display);
  const ref=db.ref(`${TEST_ROOT}/scores/${key}`);
  ref.once("value").then(snap=>{
    const old=snap.val();
    if(!old || score>Number(old.score||0)){
      return ref.set({name:display,score,cells,speed:speedMode,updatedAt:firebase.database.ServerValue.TIMESTAMP});
    }
  });
}
db.ref(`${TEST_ROOT}/scores`).on("value",snap=>{
  const rows=[];
  snap.forEach(ch=>rows.push(ch.val()));
  rows.sort((a,b)=>Number(b.score||0)-Number(a.score||0));
  const host=document.getElementById("rankRows");
  if(!rows.length){host.innerHTML=`<div class="row"><span>還沒有成績</span><strong>—</strong></div>`;return;}
  host.innerHTML=rows.slice(0,10).map((r,i)=>{
    const medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":`${i+1}.`;
    return `<div class="row"><span>${medal} ${escapeHtml(r.name)} <span class="tag">${r.cells}格・${escapeHtml(r.speed)}</span></span><strong>${Number(r.score||0)} 分</strong></div>`;
  }).join("");
});
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
</script>
</body>
</html>
