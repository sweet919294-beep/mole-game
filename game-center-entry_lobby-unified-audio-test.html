<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>遊戲活動中心｜Unified Host Audio Diagnostic</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#f6f7f9;color:#222;overflow:hidden}
    #entryView{width:100%;height:100%;display:grid;place-items:center;padding:24px}
    .card{width:min(92vw,480px);background:#fff;border-radius:18px;padding:28px 22px;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.08)}
    h1{margin:0 0 12px;font-size:24px}
    p{margin:0 0 20px;line-height:1.65;color:#555}
    button{width:100%;border:0;border-radius:14px;padding:16px 18px;background:#111;color:#fff;font-size:18px;font-weight:700;touch-action:manipulation}
    #status{margin-top:16px;font-size:14px;color:#666}
    #lobbyFrame{display:none;width:100%;height:100%;border:0;background:#fff}
  </style>
</head>
<body>
  <section id="entryView">
    <div class="card">
      <h1>ENTRY → LOBBY 統一音源診斷</h1>
      <p>只測試兩件事：四個遊戲入口都停止入口 BGM；LOBBY 右上角音樂按鈕只控制宿主 BGM，不再啟動第二支音樂。</p>
      <button id="enterBtn" type="button">進入遊戲活動中心</button>
      <div id="status">尚未測試</div>
    </div>
  </section>

  <iframe id="lobbyFrame" title="遊戲活動中心 LOBBY"
          src="about:blank" allow="autoplay; fullscreen"></iframe>

  <audio id="hostBgm" loop preload="auto"
         src="./tunetank-music-box-sleep-lullaby-349471.mp3"></audio>

  <script>
    const entryView = document.getElementById('entryView');
    const enterBtn = document.getElementById('enterBtn');
    const status = document.getElementById('status');
    const lobbyFrame = document.getElementById('lobbyFrame');
    const hostBgm = document.getElementById('hostBgm');

    function stopHostBgm(){
      hostBgm.pause();
      hostBgm.currentTime = 0;
    }

    function syncLobbyButton(btn){
      if(!btn) return;
      btn.textContent = hostBgm.paused ? '♫' : '❚❚';
      btn.setAttribute(
        'aria-label',
        hostBgm.paused ? '播放活動中心音樂' : '暫停活動中心音樂'
      );
    }

    function bindLobbyControls(){
      try{
        const doc = lobbyFrame.contentDocument;
        if(!doc) return;

        const innerBgm = doc.getElementById('lobbyBgm');
        const musicBtn = doc.getElementById('lobbyMusicButton');
        const gameLinks = doc.querySelectorAll('a.card.active');

        // 診斷版只允許父層 hostBgm 成為入口/LOBBY 唯一音源。
        if(innerBgm){
          innerBgm.pause();
          innerBgm.currentTime = 0;
          innerBgm.addEventListener('play', () => {
            innerBgm.pause();
            innerBgm.currentTime = 0;
          });
        }

        if(musicBtn){
          // capture 階段攔截，避免正式 LOBBY 原本的匿名 click handler 再啟動 innerBgm。
          musicBtn.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopImmediatePropagation();

            if(hostBgm.paused){
              hostBgm.play().catch(()=>{});
            }else{
              hostBgm.pause();
            }
            syncLobbyButton(musicBtn);
          }, true);

          hostBgm.addEventListener('play', () => syncLobbyButton(musicBtn));
          hostBgm.addEventListener('pause', () => syncLobbyButton(musicBtn));
          syncLobbyButton(musicBtn);
        }

        // 四個遊戲入口都視為「離開 LOBBY」邊界。
        gameLinks.forEach(link => {
          link.addEventListener('click', stopHostBgm, {capture:true});
        });

      }catch(e){
        status.textContent = 'LOBBY 控制綁定失敗';
      }
    }

    lobbyFrame.addEventListener('load', bindLobbyControls);

    enterBtn.addEventListener('click', () => {
      hostBgm.volume = 0.42;
      const p = hostBgm.play();

      if(p && typeof p.then === 'function'){
        p.then(() => {
          status.textContent = '入口 BGM：成功';
        }).catch((err) => {
          status.textContent = '入口 BGM：失敗｜' + (err && err.name ? err.name : 'unknown');
        });
      }

      lobbyFrame.src = './game-center-lobby.html';
      entryView.style.display = 'none';
      lobbyFrame.style.display = 'block';
    }, {once:true});
  </script>
</body>
</html>
