<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>歡迎來到遊戲活動中心</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
body{
  overflow-x:hidden;
  color:#657695;
  background:
    radial-gradient(circle at 18% 18%,rgba(255,255,255,.96) 0 2%,transparent 22%),
    linear-gradient(155deg,#eaf5ff 0%,#f6f4ff 48%,#fff3f8 100%);
}
.stage{
  position:relative;
  min-height:100vh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:38px 24px 34px;
}
.cloud{position:absolute;background:rgba(255,255,255,.72);border-radius:999px;filter:blur(.2px);opacity:.8}
.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
.c1{width:180px;height:52px;left:-30px;top:13%;animation:cloudMove 28s ease-in-out infinite alternate}
.c1:before{width:75px;height:75px;left:35px;bottom:6px}.c1:after{width:100px;height:90px;right:15px;bottom:0}
.c2{width:220px;height:58px;right:-55px;top:19%;animation:cloudMove2 34s ease-in-out infinite alternate}
.c2:before{width:90px;height:82px;left:28px;bottom:7px}.c2:after{width:112px;height:98px;right:20px;bottom:0}
.c3{width:210px;height:52px;left:18%;bottom:7%;opacity:.55;animation:cloudMove 40s ease-in-out infinite alternate}

.spark{position:absolute;font-size:22px;color:#fff;text-shadow:0 0 12px rgba(255,255,255,.9);animation:twinkle 3.5s ease-in-out infinite}
.s1{left:13%;top:24%;animation-delay:.3s}.s2{right:15%;top:31%;animation-delay:1.4s}.s3{left:29%;top:13%;animation-delay:2.1s}.s4{right:30%;top:15%;animation-delay:.8s}.s5{left:19%;bottom:25%;animation-delay:1.8s}.s6{right:20%;bottom:20%;animation-delay:2.7s}
.heart{position:absolute;color:#efb2c6;font-size:20px;opacity:.72;animation:twinkle 4.2s ease-in-out infinite}

.balloon{position:absolute;width:82px;height:96px;border-radius:52% 52% 48% 48%;box-shadow:inset -12px -14px 18px rgba(75,83,120,.08),inset 12px 12px 18px rgba(255,255,255,.55),0 12px 22px rgba(84,99,130,.09);animation:float 6.8s ease-in-out infinite}
.balloon:before{content:"";position:absolute;width:15px;height:12px;left:50%;bottom:-9px;transform:translateX(-50%);clip-path:polygon(50% 0,100% 100%,0 100%);background:inherit}
.balloon:after{content:"";position:absolute;width:1.5px;height:100px;background:rgba(117,125,150,.35);left:50%;top:100%}
.b1{left:5%;top:16%;background:#efafc1;transform:rotate(-6deg);animation-duration:7.2s}
.b2{left:14%;bottom:14%;width:67px;height:79px;background:#a9c8ec;animation-duration:8.4s;animation-delay:-2.1s}
.b3{right:6%;top:14%;background:#b9a9df;transform:rotate(7deg);animation-duration:7.8s;animation-delay:-1.2s}
.b4{right:15%;bottom:13%;width:70px;height:82px;background:#f2d28b;animation-duration:9s;animation-delay:-3.3s}
.b5{left:23%;top:9%;width:54px;height:64px;background:#a9d8ca;animation-duration:8.7s;animation-delay:-4s}
.b6{right:24%;top:8%;width:57px;height:67px;background:#efb4c6;animation-duration:7.6s;animation-delay:-2.8s}

.content{position:relative;z-index:5;width:min(850px,94vw);text-align:center}
.ribbon{display:inline-block;padding:8px 27px;background:rgba(255,255,255,.74);border:1px solid rgba(255,255,255,.96);border-radius:999px;color:#9a91ad;font-weight:800;letter-spacing:4px;box-shadow:0 7px 22px rgba(89,103,137,.07)}
h1{margin:15px 0 7px;font-size:clamp(43px,7vw,75px);letter-spacing:4px;color:#7183ab;text-shadow:0 4px 0 rgba(255,255,255,.9),0 8px 20px rgba(106,124,160,.12)}
.sub{margin:0 auto 25px;font-size:clamp(15px,2vw,19px);color:#929caf;letter-spacing:2px}
.enter{
  display:inline-flex;align-items:center;justify-content:center;gap:12px;
  min-width:250px;padding:16px 36px;border:0;border-radius:24px;
  background:linear-gradient(135deg,#9ebee8,#9faddd);
  color:white;text-decoration:none;font-size:22px;font-weight:900;letter-spacing:3px;
  box-shadow:0 13px 28px rgba(105,131,180,.22),inset 0 1px 0 rgba(255,255,255,.55);
  animation:breathe 3.1s ease-in-out infinite;
}
.enter:active{transform:scale(.98)}
.features{margin:46px auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;max-width:760px}
.feature{min-width:0}
.ico{width:67px;height:67px;margin:auto;display:flex;align-items:center;justify-content:center;border-radius:23px;background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.9);font-size:32px;box-shadow:0 8px 22px rgba(93,106,137,.07)}
.feature b{display:block;margin-top:9px;color:#7d8ba4;font-size:14px}
.feature small{display:block;margin-top:3px;color:#a4abba;font-size:11px}
.footer{margin-top:38px;color:#a0a8b7;font-size:13px;letter-spacing:2px}

@keyframes float{0%,100%{translate:0 0;rotate:-1deg}50%{translate:10px -20px;rotate:3deg}}
@keyframes twinkle{0%,100%{opacity:.22;transform:scale(.8)}50%{opacity:.95;transform:scale(1.18)}}
@keyframes breathe{0%,100%{transform:scale(1);box-shadow:0 13px 28px rgba(105,131,180,.20)}50%{transform:scale(1.025);box-shadow:0 16px 34px rgba(105,131,180,.29)}}
@keyframes cloudMove{from{transform:translateX(-12px)}to{transform:translateX(34px)}}
@keyframes cloudMove2{from{transform:translateX(18px)}to{transform:translateX(-34px)}}

@media(max-width:700px){
 .stage{padding:30px 17px;align-items:flex-start}
 .content{padding-top:12vh}
 .features{grid-template-columns:repeat(2,1fr);max-width:360px;margin-top:38px;gap:22px 10px}
 .balloon{transform:scale(.72)}
 .b1{left:-3%}.b3{right:-4%}.b5,.b6{display:none}
 .ribbon{font-size:12px}.footer{margin-top:30px}
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{animation:none!important}
}
</style>
</head>
<body>
<main class="stage">
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>

  <span class="spark s1">✦</span><span class="spark s2">✧</span><span class="spark s3">✦</span>
  <span class="spark s4">✧</span><span class="spark s5">✦</span><span class="spark s6">✧</span>
  <span class="heart" style="left:9%;bottom:30%">♡</span>
  <span class="heart" style="right:10%;bottom:32%;animation-delay:1.5s">♡</span>

  <i class="balloon b1"></i><i class="balloon b2"></i><i class="balloon b3"></i>
  <i class="balloon b4"></i><i class="balloon b5"></i><i class="balloon b6"></i>

  <section class="content">
    <div class="ribbon">歡迎來到</div>
    <h1>遊戲活動中心</h1>
    <p class="sub">一起玩遊戲・探索驚喜・創造美好回憶</p>

    <a class="enter" href="./index.html"><span>▶</span> 點擊進入</a>

    <div class="features" aria-label="活動特色">
      <div class="feature"><div class="ico">🎮</div><b>多款遊戲</b><small>輕鬆開始挑戰</small></div>
      <div class="feature"><div class="ico">🎁</div><b>驚喜探索</b><small>看看今天遇見什麼</small></div>
      <div class="feature"><div class="ico">🏆</div><b>挑戰高分</b><small>刷新自己的紀錄</small></div>
      <div class="feature"><div class="ico">🎈</div><b>開心時光</b><small>一起享受遊戲</small></div>
    </div>

    <div class="footer">✦ 祝你玩得開心，滿載而歸 ✦</div>
  </section>
</main>
</body>
</html>
