<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>遊戲活動中心｜Same Document Audio Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: #f6f7f9;
      color: #222;
    }
    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(92vw, 480px);
      background: #fff;
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 8px 28px rgba(0,0,0,.08);
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 24px; }
    p { margin: 0 0 20px; line-height: 1.6; color: #555; }
    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px 18px;
      background: #111;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      touch-action: manipulation;
    }
    #lobby { display: none; }
    .status {
      margin-top: 18px;
      font-size: 14px;
      color: #666;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <section id="entry" class="page">
    <div class="card">
      <h1>ENTRY 診斷頁</h1>
      <p>只測試：同一個 document 內，第一次 click 是否能直接啟動 BGM，再切換到 LOBBY 畫面。</p>
      <button id="enterBtn" type="button">進入遊戲活動中心</button>
      <div class="status">正式 ENTRY／LOBBY 不會被修改。</div>
    </div>
  </section>

  <section id="lobby" class="page">
    <div class="card">
      <h1>LOBBY 診斷畫面</h1>
      <p>如果進到這裡時已經有音樂，代表同頁保留 document 的路徑可重現一次點擊啟動。</p>
      <div id="playState" class="status">等待測試</div>
    </div>
  </section>

  <audio id="bgm" loop preload="auto"
    src="./tunetank-music-box-sleep-lullaby-349471.mp3"></audio>

  <script>
    const entry = document.getElementById('entry');
    const lobby = document.getElementById('lobby');
    const enterBtn = document.getElementById('enterBtn');
    const bgm = document.getElementById('bgm');
    const playState = document.getElementById('playState');

    enterBtn.addEventListener('click', () => {
      bgm.volume = 0.42;

      const p = bgm.play();

      entry.style.display = 'none';
      lobby.style.display = 'grid';

      if (p && typeof p.then === 'function') {
        p.then(() => {
          playState.textContent = 'play()：成功';
        }).catch((err) => {
          playState.textContent = 'play()：失敗｜' + (err && err.name ? err.name : 'unknown');
        });
      } else {
        playState.textContent = 'play()：已呼叫';
      }
    }, { once: true });
  </script>
</body>
</html>
