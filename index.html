<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#566070}body{background:linear-gradient(155deg,#f3f8ff 0%,#fff7fb 48%,#f4f3f8 100%);min-height:100vh}.wrap{width:min(1050px,92vw);margin:auto;padding:42px 0 56px}.hero{text-align:center;margin-bottom:30px}.hero h1{margin:0;color:#596a85;font-size:clamp(30px,5vw,48px);letter-spacing:2px}.hero p{margin:10px 0 0;color:#8a94a5;font-size:15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.card{position:relative;overflow:hidden;min-height:330px;border:1px solid rgba(255,255,255,.95);border-radius:28px;background:rgba(255,255,255,.78);box-shadow:0 15px 40px rgba(91,109,139,.12);text-decoration:none;color:inherit;padding:24px 22px 22px;display:flex;flex-direction:column;align-items:center;transition:.18s ease}.card.active:active{transform:scale(.985)}.visual{width:100%;height:175px;border-radius:22px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.pig .visual{background:linear-gradient(145deg,#eaf5ff,#fff0f6)}.poke .visual{background:linear-gradient(145deg,#f0efff,#fceff6)}.draw .visual{background:linear-gradient(145deg,#edf6ff,#fff0f5)}.pig-img{width:145px;height:145px;object-fit:contain;filter:drop-shadow(0 8px 8px rgba(83,101,130,.15))}.hammer{font-size:56px;position:absolute;right:28px;top:22px;transform:rotate(-22deg);filter:drop-shadow(0 5px 5px rgba(80,90,110,.14))}.gift{font-size:94px;filter:drop-shadow(0 8px 7px rgba(80,90,110,.13))}.finger{font-size:54px;position:absolute;right:36px;bottom:20px;transform:rotate(-12deg)}.tickets{position:relative;width:150px;height:115px}.ticket{position:absolute;width:122px;height:62px;border-radius:13px;border:3px dashed rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:21px;box-shadow:0 7px 14px rgba(90,100,125,.12)}.t1{background:#9fbfe4;left:7px;top:35px;transform:rotate(-9deg)}.t2{background:#e8a9bd;left:25px;top:20px;transform:rotate(9deg)}.confetti{position:absolute;font-size:28px}.c1{left:24px;top:22px}.c2{right:22px;top:32px}.c3{right:38px;bottom:24px}.card h2{font-size:23px;margin:20px 0 7px;color:#5e6c82}.card p{font-size:14px;line-height:1.65;text-align:center;color:#929aa8;margin:0}.go{margin-top:auto;padding-top:18px;font-weight:800;color:#7892b5}.poke .go{color:#988ab4}.draw .go{color:#b0919c}.badge{position:absolute;right:18px;top:18px;background:#eef1f6;color:#9299a5;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:800}.coming{cursor:default;opacity:.82}.footer{text-align:center;margin-top:30px;color:#a2a9b4;font-size:12px}@media(max-width:800px){.wrap{padding-top:28px}.grid{grid-template-columns:1fr 1fr}.card{min-height:305px}.draw{grid-column:1/-1}}@media(max-width:560px){.wrap{width:min(92vw,430px)}.hero{margin-bottom:22px}.grid{grid-template-columns:1fr;gap:16px}.card,.draw{grid-column:auto;min-height:285px}.visual{height:155px}.pig-img{width:130px;height:130px}.hero h1{font-size:32px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>遊戲活動中心</h1>
    <p>選一個活動，開始玩吧 ✦</p>
  </header>
  <main class="grid">
    <a class="card active pig" href="./pig.html">
      <div class="visual"><img class="pig-img" src="./pig_normal_new.png" alt="小豬"><span class="hammer">🔨</span></div>
      <h2>小豬打打樂</h2><p>眼明手快，看看誰能拿下最高分！</p><div class="go">進入遊戲 →</div>
    </a>
    <a class="card active poke" href="./xiaobao.html">
      <div class="visual"><span class="gift">🎁</span><span class="finger">👆</span></div>
      <h2>戳戳樂</h2><p>挑一格戳下去，看看今天的幸運獎落誰家。</p><div class="go">進入活動 →</div>
    </a>
    <section class="card draw coming">
      <span class="badge">準備中</span>
      <div class="visual"><span class="confetti c1">✦</span><span class="confetti c2">⌁</span><span class="confetti c3">✧</span><div class="tickets"><div class="ticket t1">LUCKY</div><div class="ticket t2">抽獎券</div></div></div>
      <h2>線上抽獎系統</h2><p>名單、獎項、開獎與中獎紀錄，一站完成。</p><div class="go">即將登場</div>
    </section>
  </main>
  <div class="footer">更多活動陸續加入中</div>
</div>
</body>
</html>
