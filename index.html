<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>多人打地鼠大賽</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
  background:#fff9e9;
  color:#473321;
  touch-action:manipulation;
}

button,input{
  font-family:inherit;
}

.app{
  width:min(100%,620px);
  margin:auto;
  padding:16px;
}

h1{
  text-align:center;
  margin:8px 0 4px;
  font-size:30px;
}

.sub{
  text-align:center;
  color:#806c59;
  margin-bottom:18px;
}

.card{
  background:white;
  border:2px solid #ead8b8;
  border-radius:20px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 4px 12px #0000000c;
}

input{
  width:100%;
  font-size:17px;
  padding:13px;
  border:2px solid #dbc6a5;
  border-radius:12px;
  margin:6px 0;
  background:#fff;
  color:#473321;
}

button{
  border:0;
  border-radius:13px;
  padding:13px 16px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
}

.primary{
  width:100%;
  background:#6b4426;
  color:white;
  margin-top:8px;
}

.green{
  background:#338b57;
  color:white;
}

.orange{
  background:#e69031;
  color:white;
}

.hidden{
  display:none!important;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:12px;
}

.stat{
  background:white;
  border:2px solid #ead8b8;
  border-radius:14px;
  padding:10px 4px;
  text-align:center;
}

.stat small{
  display:block;
  color:#8a745f;
}

.stat strong{
  font-size:22px;
}

.status{
  text-align:center;
  background:#fff0c9;
  border-radius:13px;
  padding:10px;
  margin:10px 0;
  font-weight:700;
}

.board{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  background:#9ed36a;
  padding:12px;
  border-radius:22px;
}

.hole{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  border:0;
  padding:0;
  background:#5d391f;
  border-radius:50%;
  overflow:hidden;
  box-shadow:inset 0 8px 0 #3d2415;
  touch-action:manipulation;
}
