<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>多人打地鼠大賽</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
  background:#fff9e9;
  color:#473321;
}
.app{
  width:min(100%,620px);
  margin:auto;
  padding:16px;
}
h1{
  text-align:center;
  margin:8px 0 4px;
  font-size:30px;
}
.sub{
  text-align:center;
  color:#806c59;
  margin-bottom:18px;
}
.card{
  background:white;
  border:2px solid #ead8b8;
  border-radius:20px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 4px 12px #0000000c;
}
input{
  width:100%;
  font-size:17px;
  padding:13px;
  border:2px solid #dbc6a5;
  border-radius:12px;
  margin:6px 0;
}
button{
  border:0;
  border-radius:13px;
  padding:13px 16px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}
.primary{
  width:100%;
  background:#6b4426;
  color:white;
  margin-top:8px;
}
.green{
  background:#338b57;
  color:white;
}
.red{
  background:#c74b42;
  color:white;
}
.orange{
  background:#e69031;
  color:white;
}
.hidden{display:none!important}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:12px;
}
.stat{
  background:white;
  border:2px solid #ead8b8;
  border-radius:14px;
  padding:10px 4px;
  text-align:center;
}
.stat small{
  display:block;
  color:#8a745f;
}
.stat strong{
  font-size:22px;
}

.status{
  text-align:center;
  background:#fff0c9;
  border-radius:13px;
  padding:10px;
  margin:10px 0;
  font-weight:700;
}

.board{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  background:#9ed36a;
  padding:12px;
  border-radius:22px;
}
.hole{
  position:relative;
  aspect-ratio:1/1;
  border:0;
  background:#5d391f;
  border-radius:50%;
  overflow:hidden;
  box-shadow:inset 0 8px 0 #3d2415;
}
.mole{
  position:absolute;
  left:13%;
  right:13%;
  top:15%;
  bottom:-8%;
  border-radius:48% 48% 35% 35%;
  background:#9a633d;
  border:4px solid #654126;
  transform:translateY(115%);
  transition:transform .12s;
}
.mole::before{
  content:"";
  position:absolute;
  width:11px;
  height:11px;
  background:#21150e;
  border-radius:50%;
  left:25%;
  top:28%;
  box-shadow:38px 0 #21150e;
}
.mole::after{
  content:"";
  position:absolute;
  width:25px;
  height:15px;
  border-radius:50%;
  background:#dca47b;
  left:50%;
  top:47%;
  transform:translateX(-50%);
}
.hole.up .mole{transform:translateY(0)}
.hole.gold .mole{
  background:#ffd84c;
  border-color:#c69618;
}
.hole.bomb .mole{
  background:#333;
  border-color:#111;
}
.hole.bomb .mole::after{
  content:"💣";
  background:none;
  font-size:28px;
  width:auto;
  height:auto;
  top:35%;
}

.legend{
  text-align:center;
  font-size:13px;
  color:#776553;
  margin-top:10px;
}
.rankrow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 4px;
  border-bottom:1px solid #eee0ca;
}
.rankrow:last-child{border:0}
.me{
  font-weight:800;
  color:#a85b18;
}
.adminBtns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.countdown{
  position:fixed;
  inset:0;
  background:#000000aa;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:100px;
  font-weight:900;
  z-index:99;
}
.winner{
  text-align:center;
  font-size:22px;
  font-weight:800;
  padding:12px;
}
.note{
  font-size:12px;
  color:#8a745f;
  text-align:center;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="app">

<h1>🔨 多人打地鼠大賽</h1>
<div class="sub">加入比賽，看誰打得最快！</div>

<section id="joinCard" class="card">
  <h2>加入比賽</h2>

  <input id="nickname"
         maxlength="12"
         placeholder="輸入你的暱稱">

  <button id="joinBtn" class="primary">
    加入比賽
  </button>

  <div class="note">
    多支手機開啟同一網址即可一起比賽
  </div>
</section>

<section id="gameArea" class="hidden">

  <div class="stats">
    <div class="stat">
      <small>玩家</small>
      <strong id="myName">－</strong>
    </div>

    <div class="stat">
      <small>分數</small>
      <strong id="score">0</strong>
    </div>

    <div class="stat">
      <small>時間</small>
      <strong id="time">30</strong>
    </div>
  </div>

  <div id="status" class="status">
    等待主持人開始比賽
  </div>

  <div id="board" class="board"></div>

  <div class="legend">
    🟤 普通地鼠 +1　
    🟡 黃金地鼠 +3　
    💣 炸彈 −2
  </div>

</section>

<section class="card">
  <h2>🏆 即時排行榜</h2>
  <div id="ranking">
    尚未有玩家加入
  </div>
</section>

<section class="card">
  <h2>🎮 主持人控制</h2>

  <input id="adminPassword"
         type="password"
         placeholder="主持人密碼">

  <button id="adminLogin" class="primary">
    進入主持模式
  </button>

  <div id="adminPanel" class="hidden">

    <p>主持人模式已開啟</p>

    <div class="adminBtns">
      <button id="startBtn" class="green">
        開始比賽
      </button>

      <button id="resetBtn" class="orange">
        重新開局
      </button>
    </div>

  </div>
</section>

</div>

<div id="countdown" class="countdown hidden"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  update,
  onValue,
  remove,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyDlO-SmVwkR4IZnzmVEA9wNfS983DzlxLU",
  authDomain: "mole-game-3073f.firebaseapp.com",
  databaseURL: "https://mole-game-3073f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mole-game-3073f",
  storageBucket: "mole-game-3073f.firebasestorage.app",
  messagingSenderId: "942915688837",
  appId: "1:942915688837:web:4e6584ad32100b2cc24cec"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const ROOM = "main";

let playerId = localStorage.getItem("molePlayerId");

if(!playerId){
  playerId =
    "p_" +
    Date.now() +
    "_" +
    Math.random().toString(36).slice(2,8);

  localStorage.setItem("molePlayerId",playerId);
}

let nickname="";
let score=0;
let playing=false;
let moleTimer=null;
let clockTimer=null;
let currentHole=-1;
let lastGameId=null;
let gameEndAt=0;


const $ = id => document.getElementById(id);

const board=$("board");

for(let i=0;i<9;i++){

  const hole=document.createElement("button");

  hole.className="hole";
  hole.dataset.index=i;

  const mole=document.createElement("div");
  mole.className="mole";

  hole.appendChild(mole);

  hole.addEventListener("click",()=>{
    hitMole(i,hole);
  });

  board.appendChild(hole);
}


$("joinBtn").onclick=async()=>{

  const name=$("nickname").value.trim();

  if(!name){
    alert("請先輸入暱稱");
    return;
  }

  nickname=name;

  await set(
    ref(db,`rooms/${ROOM}/players/${playerId}`),
    {
      name:nickname,
      score:0,
      joinedAt:serverTimestamp()
    }
  );

  $("joinCard").classList.add("hidden");
  $("gameArea").classList.remove("hidden");
  $("myName").textContent=nickname;

};


function hitMole(index,hole){

  if(!playing) return;
  if(index!==currentHole) return;
  if(!hole.classList.contains("up")) return;

  let points=1;

  if(hole.classList.contains("gold"))
    points=3;

  if(hole.classList.contains("bomb"))
    points=-2;

  score=Math.max(0,score+points);

  $("score").textContent=score;

  hole.classList.remove("up");

  currentHole=-1;

  update(
    ref(db,`rooms/${ROOM}/players/${playerId}`),
    {score}
  );

}


function hideAll(){

  document
    .querySelectorAll(".hole")
    .forEach(h=>{
      h.className="hole";
    });

  currentHole=-1;
}


function spawnMole(){

  if(!playing) return;

  hideAll();

  const holes=
    document.querySelectorAll(".hole");

  let next;

  do{
    next=Math.floor(Math.random()*holes.length);
  }
  while(next===currentHole);

  currentHole=next;

  const hole=holes[next];

  const r=Math.random();

  if(r<0.12){
    hole.classList.add("bomb");
  }
  else if(r<0.27){
    hole.classList.add("gold");
  }

  hole.classList.add("up");

  const speed=
    500 + Math.random()*450;

  clearTimeout(moleTimer);

  moleTimer=setTimeout(()=>{
    if(hole.classList.contains("up")){
      hole.classList.remove("up");
      currentHole=-1;
    }

    spawnMole();

  },speed);

}


function startLocalGame(game){

  if(playing) return;

  score=0;

  $("score").textContent=0;

  playing=true;

  gameEndAt=game.endAt;

  $("status").textContent="比賽進行中！";

  spawnMole();

  clearInterval(clockTimer);

  clockTimer=setInterval(()=>{

    const left=
      Math.max(
        0,
        Math.ceil(
          (gameEndAt-Date.now())/1000
        )
      );

    $("time").textContent=left;

    if(left<=0)
      finishGame();

  },200);

}


function finishGame(){

  if(!playing) return;

  playing=false;

  clearTimeout(moleTimer);
  clearInterval(clockTimer);

  hideAll();

  $("time").textContent="0";
  $("status").textContent="比賽結束！";

  update(
    ref(db,`rooms/${ROOM}/players/${playerId}`),
    {score}
  );

}


async function countdown(game){

  const overlay=$("countdown");

  overlay.classList.remove("hidden");

  while(true){

    const diff=
      game.startAt-Date.now();

    if(diff<=0)
      break;

    const n=
      Math.ceil(diff/1000);

    overlay.textContent=n;

    await new Promise(
      r=>setTimeout(r,150)
    );
  }

  overlay.textContent="GO!";

  await new Promise(
    r=>setTimeout(r,450)
  );

  overlay.classList.add("hidden");

  startLocalGame(game);

}


onValue(
  ref(db,`rooms/${ROOM}/game`),
  snapshot=>{

    const game=snapshot.val();

    if(!game) return;

    if(
      game.state==="countdown" &&
      game.gameId!==lastGameId
    ){

      lastGameId=game.gameId;

      countdown(game);

    }

    if(game.state==="waiting"){

      playing=false;

      clearTimeout(moleTimer);
      clearInterval(clockTimer);

      hideAll();

      score=0;

      $("score").textContent=0;
      $("time").textContent=30;

      $("status").textContent=
        "等待主持人開始比賽";

    }

  }
);


onValue(
  ref(db,`rooms/${ROOM}/players`),
  snapshot=>{

    const data=snapshot.val() || {};

    const players=
      Object.entries(data)
      .map(([id,p])=>({
        id,
        name:p.name || "玩家",
        score:Number(p.score)||0
      }))
      .sort((a,b)=>b.score-a.score);

    const rank=$("ranking");

    if(players.length===0){

      rank.textContent=
        "尚未有玩家加入";

      return;
    }

    rank.innerHTML="";

    players.forEach((p,i)=>{

      const row=
        document.createElement("div");

      row.className=
        "rankrow"+
        (p.id===playerId?" me":"");

      const medals=
        ["🥇","🥈","🥉"];

      row.innerHTML=
        `<span>
          ${medals[i] || (i+1)+'.'}
          ${escapeHtml(p.name)}
        </span>
        <strong>${p.score} 分</strong>`;

      rank.appendChild(row);

    });

  }
);


function escapeHtml(text){

  const d=document.createElement("div");

  d.textContent=text;

  return d.innerHTML;

}


$("adminLogin").onclick=()=>{

  const pass=
    $("adminPassword").value;

  /*
    目前先使用簡易主持密碼。
    之後可以再升級 Firebase Authentication。
  */

  if(pass!=="8888"){

    alert("主持人密碼錯誤");
    return;

  }

  $("adminPanel")
    .classList.remove("hidden");

  $("adminPassword")
    .classList.add("hidden");

  $("adminLogin")
    .classList.add("hidden");

};


$("startBtn").onclick=async()=>{

  const now=Date.now();

  const startAt=
    now+4000;

  const endAt=
    startAt+30000;

  const gameId=
    "g_"+now;

  const playersSnap =
    await import(
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js"
    );

  await set(
    ref(db,`rooms/${ROOM}/game`),
    {
      state:"countdown",
      gameId,
      startAt,
      endAt
    }
  );

};


$("resetBtn").onclick=async()=>{

  playing=false;

  clearTimeout(moleTimer);
  clearInterval(clockTimer);

  hideAll();

  const snapRef=
    ref(db,`rooms/${ROOM}/players`);

  onValue(
    snapRef,
    snapshot=>{

      const data=snapshot.val();

      if(data){

        Object.keys(data).forEach(id=>{

          update(
            ref(
              db,
              `rooms/${ROOM}/players/${id}`
            ),
            {score:0}
          );

        });

      }

    },
    {onlyOnce:true}
  );

  await set(
    ref(db,`rooms/${ROOM}/game`),
    {
      state:"waiting",
      resetAt:Date.now()
    }
  );

};

</script>

</body>
</html>
