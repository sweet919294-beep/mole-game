<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>遊戲活動中心｜Audio Lifecycle Diagnostic</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#f6f7f9;color:#222;overflow:hidden}
    #entryView{position:fixed;inset:0;overflow:hidden;background:#f8edf5}
    .entry-stage{
      position:absolute;left:50%;top:50%;
      width:100vw;aspect-ratio:2/3;
      transform:translate(-50%,-50%);
      overflow:visible
    }
    .entry-art{
      position:absolute;inset:0;width:100%;height:100%;
      object-fit:contain;display:block;pointer-events:none
    }
    .noteSprite{position:absolute;pointer-events:none;transform-origin:50% 50%;will-change:transform}
    .notePinkL{left:9.77%;top:19.21%;width:4.88%;height:3.91%;animation:noteSwayA 2.7s ease-in-out infinite alternate}
    .noteBlueL{left:4.69%;top:25.85%;width:5.57%;height:3.97%;animation:noteSwayB 3.0s ease-in-out .25s infinite alternate}
    .notePinkR{left:89.45%;top:24.61%;width:5.86%;height:4.49%;animation:noteSwayB 2.8s ease-in-out .4s infinite alternate}
    .notePurpleR{left:87.89%;top:35.29%;width:7.03%;height:5.47%;animation:noteSwayA 3.1s ease-in-out .6s infinite alternate}

    .mote{
      position:absolute;width:7px;height:7px;border-radius:50%;
      background:rgba(255,255,255,.98);
      box-shadow:0 0 12px rgba(255,255,255,.98),0 0 24px rgba(255,220,244,.88);
      pointer-events:none;will-change:transform,opacity
    }
    .m1{left:10%;top:16%;animation:driftA 3.3s ease-in-out infinite}
    .m2{left:22%;top:10%;animation:driftB 3.7s ease-in-out .35s infinite}
    .m3{left:38%;top:20%;animation:driftC 4.0s ease-in-out .8s infinite}
    .m4{left:62%;top:12%;animation:driftA 3.6s ease-in-out .6s infinite}
    .m5{left:78%;top:18%;animation:driftB 3.9s ease-in-out 1.0s infinite}
    .m6{left:91%;top:30%;animation:driftC 4.2s ease-in-out .25s infinite}
    .m7{left:8%;top:48%;animation:driftB 3.5s ease-in-out 1.15s infinite}
    .m8{left:18%;top:63%;animation:driftA 4.0s ease-in-out .45s infinite}
    .m9{left:83%;top:54%;animation:driftC 3.8s ease-in-out .75s infinite}
    .m10{left:92%;top:69%;animation:driftA 4.1s ease-in-out 1.3s infinite}
    .m11{left:30%;top:78%;animation:driftB 3.9s ease-in-out .2s infinite}
    .m12{left:71%;top:81%;animation:driftC 4.3s ease-in-out .95s infinite}

    #enterBtn{
      position:absolute;left:19%;top:57.2%;width:62%;height:8.8%;
      border:0;background:transparent;color:transparent;padding:0;margin:0;
      cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent
    }
    #status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

    @keyframes noteSwayA{from{transform:translateX(-2px) rotate(-2deg)}to{transform:translateX(3px) rotate(2deg)}}
    @keyframes noteSwayB{from{transform:translateX(2px) rotate(2deg)}to{transform:translateX(-3px) rotate(-2deg)}}
    @keyframes driftA{
      0%,100%{transform:translate3d(-2px,3px,0) scale(.72);opacity:.16}
      50%{transform:translate3d(16px,-22px,0) scale(1.55);opacity:1}
    }
    @keyframes driftB{
      0%,100%{transform:translate3d(3px,2px,0) scale(.78);opacity:.18}
      50%{transform:translate3d(-15px,-20px,0) scale(1.48);opacity:.98}
    }
    @keyframes driftC{
      0%,100%{transform:translate3d(-1px,-1px,0) scale(.70);opacity:.14}
      50%{transform:translate3d(10px,18px,0) scale(1.42);opacity:.94}
    }
    #lobbyFrame{display:none;width:100%;height:100%;border:0;background:#fff}
    #loadingView{
      display:none;position:fixed;inset:0;z-index:20;
      align-items:center;justify-content:center;
      background:#f6f7f9;color:#555;font-size:16px;font-weight:600
    }
  </style>
</head>

      <button id="enterBtn" type="button" aria-label="點擊進入遊戲活動中心">點擊進入</button>
    </div>
    <div id="status" aria-live="polite">尚未測試</div>
  </section>

  <iframe id="lobbyFrame" title="遊戲活動中心 LOBBY"
          src="about:blank" allow="autoplay; fullscreen"></iframe>

  <div id="loadingView">活動中心載入中…</div>

  <audio id="hostBgm" loop preload="auto"
         src="./tunetank-music-box-sleep-lullaby-349471.mp3"></audio>

  <script>
    const entryView = document.getElementById('entryView');
    const enterBtn = document.getElementById('enterBtn');
    const status = document.getElementById('status');
    const lobbyFrame = document.getElementById('lobbyFrame');
    const loadingView = document.getElementById('loadingView');
    const hostBgm = document.getElementById('hostBgm');

    function playHostBgm(){
      hostBgm.volume = 0.42;
      const p = hostBgm.play();
      if(p && typeof p.catch === 'function') p.catch(()=>{});
    }

    function stopHostBgm(){
      hostBgm.pause();
      hostBgm.currentTime = 0;
    }

    function isLobbyDocument(doc){
      try{
        return !!doc &&
          !!doc.getElementById('activityCenter') &&
          !!doc.getElementById('balloonEntry');
      }catch(_){
        return false;
      }
    }

    function bindLobby(){
      const doc = lobbyFrame.contentDocument;
      if(!isLobbyDocument(doc)) return false;

      const innerBgm = doc.getElementById('lobbyBgm');
      const musicBtn = doc.getElementById('lobbyMusicButton');
      const balloonEntry = doc.getElementById('balloonEntry');
      const balloonBgm = doc.getElementById('balloonBgm');
      const gameLinks = [...doc.querySelectorAll('a.card.active')];

      // 本輪唯一新增：只補償射氣球 BGM 聽感音量。
      // 正式 LOBBY 的 startMusicOnce 會先寫入 0.42，因此在實際 play 時再校正為 0.75。
      if(balloonBgm){
        balloonBgm.addEventListener('play', () => {
          balloonBgm.volume = 0.82;
        });
      }

      // 只允許 hostBgm 作為活動中心入口/LOBBY 音源，避免疊音。
      if(innerBgm){
        innerBgm.pause();
        innerBgm.currentTime = 0;
        innerBgm.addEventListener('play', () => {
          innerBgm.pause();
          innerBgm.currentTime = 0;
        });
      }

      if(musicBtn){
        musicBtn.addEventListener('click', (event) => {
          event.preventDefault();
          event.stopImmediatePropagation();
          if(hostBgm.paused) playHostBgm();
          else hostBgm.pause();
        }, true);
      }

      // 關鍵修正診斷：
      // 正式 LOBBY 的 balloonEntry 有 pointerdown => startMusicOnce。
      // 在 capture 階段阻擋 pointerdown，避免「滑動」被誤判為進入射氣球。
      // 真正 click 仍放行，正式既有 click handler 會在 click 時才啟動氣球 BGM。
      if(balloonEntry){
        balloonEntry.addEventListener('pointerdown', (event) => {
          event.stopImmediatePropagation();
        }, true);
      }

      // 射氣球維持正式 LOBBY 原本的同 document 流程；
      // 其他一般遊戲離開 iframe，改由頂層頁面正常開啟。
      gameLinks.forEach(link => {
        if(link === balloonEntry){
          link.addEventListener('click', stopHostBgm, {capture:true});
          return;
        }

        link.addEventListener('click', (event) => {
          event.preventDefault();
          event.stopImmediatePropagation();
          stopHostBgm();
          window.top.location.href = link.href;
        }, {capture:true});
      });

      return true;
    }

    function showLobbyWhenBound(){
      try{
        const inLobby = bindLobby();
        if(!inLobby) return false;

        lobbyFrame.style.visibility = 'visible';
        lobbyFrame.style.pointerEvents = 'auto';
        loadingView.style.display = 'none';

        // 從一般遊戲返回正式 LOBBY 時，恢復同一支已解鎖過的 hostBgm。
        if(entryView.style.display === 'none'){
          playHostBgm();
          status.textContent = 'LOBBY：入口 BGM 已恢復';
        }
        return true;
      }catch(e){
        status.textContent = 'LOBBY 綁定失敗';
        return false;
      }
    }

    lobbyFrame.addEventListener('load', () => {
      // 不讓玩家在 bindLobby 尚未完成前點到正式 LOBBY 卡片。
      lobbyFrame.style.visibility = 'hidden';
      lobbyFrame.style.pointerEvents = 'none';

      if(showLobbyWhenBound()) return;

      // 若 load 事件早於 LOBBY 關鍵節點可取得，只重試綁定，不修改任何遊戲邏輯。
      let attempts = 0;
      const timer = setInterval(() => {
        attempts += 1;
        if(showLobbyWhenBound() || attempts >= 20){
          clearInterval(timer);
          if(attempts >= 20 && lobbyFrame.style.visibility !== 'visible'){
            status.textContent = 'LOBBY 綁定逾時';
          }
        }
      }, 50);
    });

    enterBtn.addEventListener('click', () => {
      hostBgm.volume = 0.42;
      const p = hostBgm.play();

      if(p && typeof p.then === 'function'){
        p.then(() => {
          status.textContent = '入口 BGM：成功';
        }).catch((err) => {
          status.textContent = '入口 BGM：失敗｜' + (err && err.name ? err.name : 'unknown');
        });
      }

      loadingView.style.display = 'flex';
      lobbyFrame.style.visibility = 'hidden';
      lobbyFrame.style.pointerEvents = 'none';
      lobbyFrame.src = './game-center-lobby.html';
      entryView.style.display = 'none';
      lobbyFrame.style.display = 'block';
    }, {once:true});
  </script>
</body>
</html>
