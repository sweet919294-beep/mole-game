<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>遊戲活動中心｜Audio Lifecycle Diagnostic</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#f6f7f9;color:#222;overflow:hidden}
    #entryView{position:fixed;inset:0;overflow:hidden;background:#f8edf5}
    #entryView::before{
      content:"";position:absolute;inset:-24px;
      background:url("./game-center-entry-portrait-final.png") center/cover no-repeat;
      filter:blur(22px) saturate(.82) brightness(1.08);
      opacity:.22;transform:scale(1.06);pointer-events:none
    }
    .entry-stage{
      position:absolute;inset:0;
      display:flex;align-items:center;justify-content:center;
      overflow:hidden
    }
    .entry-art{
      position:absolute;inset:0;width:100%;height:100%;
      object-fit:contain;display:block;pointer-events:none
    }
    /* 只做局部光感，不搬動或重畫定版元素 */
    .pulse-zone{
      position:absolute;inset:0;
      background:url("./game-center-entry-portrait-final.png") center/contain no-repeat;
      pointer-events:none;opacity:0
    }
    .pulse-star{
      clip-path:inset(2% 79% 83% 2%);
      animation:softPulse 2.7s ease-in-out infinite
    }
    .pulse-secret{
      clip-path:inset(3% 38% 82% 38%);
      animation:softPulse 3.1s ease-in-out .45s infinite
    }
    .pulse-rainbow{
      clip-path:inset(2% 0 78% 70%);
      animation:softPulse 3.6s ease-in-out .9s infinite
    }

    /* 真正會移動的細小光點：只疊動畫，不改定版圖內容 */
    .mote{
      position:absolute;width:5px;height:5px;border-radius:50%;
      background:rgba(255,255,255,.95);
      box-shadow:0 0 10px rgba(255,255,255,.95),0 0 18px rgba(255,222,244,.7);
      pointer-events:none;opacity:.25;will-change:transform,opacity
    }
    .m1{left:17%;top:20%;animation:driftA 4.2s ease-in-out infinite}
    .m2{left:31%;top:12%;animation:driftB 5.1s ease-in-out .7s infinite}
    .m3{left:62%;top:18%;animation:driftA 4.7s ease-in-out 1.2s infinite}
    .m4{left:84%;top:28%;animation:driftB 5.4s ease-in-out .2s infinite}
    .m5{left:12%;top:46%;animation:driftB 4.5s ease-in-out 1.5s infinite}
    .m6{left:91%;top:52%;animation:driftA 5.2s ease-in-out .9s infinite}
    .m7{left:26%;top:69%;animation:driftA 4.8s ease-in-out .35s infinite}
    .m8{left:77%;top:73%;animation:driftB 5.0s ease-in-out 1.8s infinite}

    #enterBtn{
      position:absolute;left:19%;top:57.2%;width:62%;height:8.8%;
      border:0;background:transparent;color:transparent;padding:0;margin:0;
      cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent
    }
    #status{
      position:absolute;width:1px;height:1px;overflow:hidden;
      clip-path:inset(50%);white-space:nowrap
    }

    @keyframes softPulse{
      0%,100%{opacity:0;filter:brightness(1)}
      45%{opacity:.20;filter:brightness(1.16)}
      60%{opacity:.10;filter:brightness(1.08)}
    }
    @keyframes driftA{
      0%,100%{transform:translate3d(0,0,0) scale(.75);opacity:.20}
      50%{transform:translate3d(9px,-13px,0) scale(1.35);opacity:.95}
    }
    @keyframes driftB{
      0%,100%{transform:translate3d(0,0,0) scale(.8);opacity:.18}
      50%{transform:translate3d(-8px,-11px,0) scale(1.25);opacity:.9}
    }
    @media (prefers-reduced-motion:reduce){
      .mote,.pulse-zone{animation-duration:8s}
    }
    #lobbyFrame{display:none;width:100%;height:100%;border:0;background:#fff}
    #loadingView{
      display:none;position:fixed;inset:0;z-index:20;
      align-items:center;justify-content:center;
      background:#f6f7f9;color:#555;font-size:16px;font-weight:600
    }
  </style>
</head>
<body>
  <section id="entryView" aria-label="遊戲活動中心主入口">
    <div class="entry-stage">
      <img class="entry-art" src="./game-center-entry-portrait-final.png" alt="">
      <span class="pulse-zone pulse-star"></span>
      <span class="pulse-zone pulse-secret"></span>
      <span class="pulse-zone pulse-rainbow"></span>
      <i class="mote m1"></i><i class="mote m2"></i><i class="mote m3"></i><i class="mote m4"></i>
      <i class="mote m5"></i><i class="mote m6"></i><i class="mote m7"></i><i class="mote m8"></i>
      <button id="enterBtn" type="button" aria-label="點擊進入遊戲活動中心">點擊進入</button>
    </div>
    <div id="status" aria-live="polite">尚未測試</div>
  </section>

  <iframe id="lobbyFrame" title="遊戲活動中心 LOBBY"
          src="about:blank" allow="autoplay; fullscreen"></iframe>

  <div id="loadingView">活動中心載入中…</div>

  <audio id="hostBgm" loop preload="auto"
         src="./tunetank-music-box-sleep-lullaby-349471.mp3"></audio>

  <script>
    const entryView = document.getElementById('entryView');
    const enterBtn = document.getElementById('enterBtn');
    const status = document.getElementById('status');
    const lobbyFrame = document.getElementById('lobbyFrame');
    const loadingView = document.getElementById('loadingView');
    const hostBgm = document.getElementById('hostBgm');

    function playHostBgm(){
      hostBgm.volume = 0.42;
      const p = hostBgm.play();
      if(p && typeof p.catch === 'function') p.catch(()=>{});
    }

    function stopHostBgm(){
      hostBgm.pause();
      hostBgm.currentTime = 0;
    }

    function isLobbyDocument(doc){
      try{
        return !!doc &&
          !!doc.getElementById('activityCenter') &&
          !!doc.getElementById('balloonEntry');
      }catch(_){
        return false;
      }
    }

    function bindLobby(){
      const doc = lobbyFrame.contentDocument;
      if(!isLobbyDocument(doc)) return false;

      const innerBgm = doc.getElementById('lobbyBgm');
      const musicBtn = doc.getElementById('lobbyMusicButton');
      const balloonEntry = doc.getElementById('balloonEntry');
      const balloonBgm = doc.getElementById('balloonBgm');
      const gameLinks = [...doc.querySelectorAll('a.card.active')];

      // 本輪唯一新增：只補償射氣球 BGM 聽感音量。
      // 正式 LOBBY 的 startMusicOnce 會先寫入 0.42，因此在實際 play 時再校正為 0.75。
      if(balloonBgm){
        balloonBgm.addEventListener('play', () => {
          balloonBgm.volume = 0.82;
        });
      }

      // 只允許 hostBgm 作為活動中心入口/LOBBY 音源，避免疊音。
      if(innerBgm){
        innerBgm.pause();
        innerBgm.currentTime = 0;
        innerBgm.addEventListener('play', () => {
          innerBgm.pause();
          innerBgm.currentTime = 0;
        });
      }

      if(musicBtn){
        musicBtn.addEventListener('click', (event) => {
          event.preventDefault();
          event.stopImmediatePropagation();
          if(hostBgm.paused) playHostBgm();
          else hostBgm.pause();
        }, true);
      }

      // 關鍵修正診斷：
      // 正式 LOBBY 的 balloonEntry 有 pointerdown => startMusicOnce。
      // 在 capture 階段阻擋 pointerdown，避免「滑動」被誤判為進入射氣球。
      // 真正 click 仍放行，正式既有 click handler 會在 click 時才啟動氣球 BGM。
      if(balloonEntry){
        balloonEntry.addEventListener('pointerdown', (event) => {
          event.stopImmediatePropagation();
        }, true);
      }

      // 射氣球維持正式 LOBBY 原本的同 document 流程；
      // 其他一般遊戲離開 iframe，改由頂層頁面正常開啟。
      gameLinks.forEach(link => {
        if(link === balloonEntry){
          link.addEventListener('click', stopHostBgm, {capture:true});
          return;
        }

        link.addEventListener('click', (event) => {
          event.preventDefault();
          event.stopImmediatePropagation();
          stopHostBgm();
          window.top.location.href = link.href;
        }, {capture:true});
      });

      return true;
    }

    function showLobbyWhenBound(){
      try{
        const inLobby = bindLobby();
        if(!inLobby) return false;

        lobbyFrame.style.visibility = 'visible';
        lobbyFrame.style.pointerEvents = 'auto';
        loadingView.style.display = 'none';

        // 從一般遊戲返回正式 LOBBY 時，恢復同一支已解鎖過的 hostBgm。
        if(entryView.style.display === 'none'){
          playHostBgm();
          status.textContent = 'LOBBY：入口 BGM 已恢復';
        }
        return true;
      }catch(e){
        status.textContent = 'LOBBY 綁定失敗';
        return false;
      }
    }

    lobbyFrame.addEventListener('load', () => {
      // 不讓玩家在 bindLobby 尚未完成前點到正式 LOBBY 卡片。
      lobbyFrame.style.visibility = 'hidden';
      lobbyFrame.style.pointerEvents = 'none';

      if(showLobbyWhenBound()) return;

      // 若 load 事件早於 LOBBY 關鍵節點可取得，只重試綁定，不修改任何遊戲邏輯。
      let attempts = 0;
      const timer = setInterval(() => {
        attempts += 1;
        if(showLobbyWhenBound() || attempts >= 20){
          clearInterval(timer);
          if(attempts >= 20 && lobbyFrame.style.visibility !== 'visible'){
            status.textContent = 'LOBBY 綁定逾時';
          }
        }
      }, 50);
    });

    enterBtn.addEventListener('click', () => {
      hostBgm.volume = 0.42;
      const p = hostBgm.play();

      if(p && typeof p.then === 'function'){
        p.then(() => {
          status.textContent = '入口 BGM：成功';
        }).catch((err) => {
          status.textContent = '入口 BGM：失敗｜' + (err && err.name ? err.name : 'unknown');
        });
      }

      loadingView.style.display = 'flex';
      lobbyFrame.style.visibility = 'hidden';
      lobbyFrame.style.pointerEvents = 'none';
      lobbyFrame.src = './game-center-lobby.html';
      entryView.style.display = 'none';
      lobbyFrame.style.display = 'block';
    }, {once:true});
  </script>
</body>
</html>
