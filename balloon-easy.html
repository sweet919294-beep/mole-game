<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>射氣球 V0.4</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;background:#dff3ff;color:#27445b;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
.top{display:flex;gap:8px;padding:8px;background:rgba(255,255,255,.8);backdrop-filter:blur(8px);font-weight:800;align-items:center;justify-content:center;flex-wrap:wrap;z-index:60}
.pill{background:#fff;border-radius:16px;padding:7px 12px;box-shadow:0 2px 8px #7aa7bd33}
.game{position:relative;overflow:hidden;background:linear-gradient(#dff4ff 0 78%,#d8f0d2 78%);touch-action:manipulation}
.cloud{position:absolute;background:#fff9;border-radius:50px;width:110px;height:34px;filter:blur(.2px);pointer-events:none}
.cloud:before,.cloud:after{content:'';position:absolute;background:#fff9;border-radius:50%}
.cloud:before{width:48px;height:48px;left:18px;top:-22px}.cloud:after{width:58px;height:58px;right:10px;top:-28px}
.legend{position:absolute;right:5px;top:7px;width:92px;background:#ffffffbf;border:1px solid #ffffffcc;border-radius:16px;padding:7px 6px;z-index:20;font-size:11px;line-height:1.32;box-shadow:0 3px 12px #527c9222;pointer-events:none;backdrop-filter:blur(4px)}
.legend b{display:block;text-align:center;margin-bottom:5px;font-size:12px}.legend div{margin:4px 0}.legend .small{font-size:10px;opacity:.78}
.start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:40;background:#dff4ffcc}
.card{background:#fffffff0;padding:22px;border-radius:24px;text-align:center;box-shadow:0 10px 35px #51798c44;max-width:88%}
.card h1{margin:0 0 8px}.btn{border:0;background:#fff;border-radius:18px;padding:12px 24px;font-weight:900;font-size:18px;color:#31546a;box-shadow:0 4px 12px #5d829733}
.balloon{position:absolute;width:76px;height:72px;border-radius:52% 52% 48% 48%;display:flex;align-items:center;justify-content:center;font-weight:1000;font-size:22px;color:#fff;text-shadow:0 2px 3px #0005;box-shadow:inset -8px -10px 14px #0002,inset 9px 9px 14px #fff7,0 5px 8px #56778933;user-select:none;-webkit-user-select:none;z-index:5;will-change:transform;touch-action:none}
.balloon:after{content:'';position:absolute;bottom:-8px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:11px solid currentColor;filter:brightness(.85)}
.gold{background:linear-gradient(135deg,#fff1a7,#d9a820);color:#d9a820}.silver{background:linear-gradient(135deg,#fff,#c9d0d5);color:#b8c0c6}.pink{background:#f38da5;color:#f38da5}.blue{background:#69aee8;color:#69aee8}.green{background:#70c995;color:#70c995}.purple{background:#a78adf;color:#a78adf}.orange{background:#f2a35e;color:#f2a35e}.balloon span{color:white;pointer-events:none}.silver span{color:#586c78;text-shadow:none}.gold span{color:#725511;text-shadow:none}
.pop{position:absolute;font-weight:1000;font-size:22px;z-index:30;pointer-events:none;animation:float .7s forwards}@keyframes float{to{transform:translateY(-40px);opacity:0}}
.msg{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:25;background:#ffffffed;padding:8px 14px;border-radius:18px;font-weight:900;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}.msg.show{opacity:1}
.end{display:none;position:absolute;inset:0;z-index:50;background:#dff4ffee;align-items:center;justify-content:center}.end.show{display:flex}.small{font-size:13px;opacity:.75}
@media(max-width:380px){.legend{width:86px;font-size:10.5px}.balloon{width:72px;height:68px;font-size:21px}}
</style>

<style>
/* SAFE_HIDE_RULES_PANEL */
.legend,.rules,.rule-box,.help,.help-box,.info,.info-box,.guide,.guide-box,.explain,.explain-box{display:none !important;}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="pill">⭐ <span id="score">0</span></div>
    <div class="pill">⏱ <span id="time">60</span> 秒</div>
    <div class="pill">🔫 <span id="ammo">20</span></div>
  </div>
  <div class="game" id="game">
    <div class="cloud" style="left:7%;top:12%"></div>
    <div class="cloud" style="left:45%;top:34%;transform:scale(.7)"></div>
    <div class="legend" id="legend">
      <b>🎈 說明</b>
      <div>彩球：依球面加分</div>
      <div>🟡 🔫?：+2 或空包</div>
      <div>⚪ ⏱+3：加 3 秒</div>
      <div class="small">特殊球不計分</div>
    </div>
    <div class="msg" id="msg"></div>
    <div class="start" id="start"><div class="card"><h1>🎈 射氣球</h1><p>V0.4｜60 秒・20 發<br>球速提升・場上更熱鬧</p><button class="btn" id="go">開始測試</button></div></div>
    <div class="end" id="end"><div class="card"><h1>本局結束</h1><p>總分：<b id="final">0</b></p><p class="small" id="stats"></p><button class="btn" id="again">再玩一次</button></div></div>
  </div>
</div>
<script>
(()=>{
const g=document.getElementById('game'), legend=document.getElementById('legend'), scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),ammoEl=document.getElementById('ammo'),msg=document.getElementById('msg');
let score=0,time=60,ammo=20,running=false,balls=[],timer,spawnTimer,shots=0,hits=0,raf=0,lastTs=0;
const colors=['pink','blue','green','purple','orange'];
const values=[1,1,1,2,2,2,3,3,5,10];
function hud(){scoreEl.textContent=score;timeEl.textContent=time;ammoEl.textContent=ammo}
function note(t){msg.textContent=t;msg.classList.add('show');clearTimeout(msg._t);msg._t=setTimeout(()=>msg.classList.remove('show'),900)}
function bounds(){const W=g.clientWidth,H=g.clientHeight;const safe=Math.max(92,legend.offsetWidth+12);return {W,H,right:Math.max(125,W-safe-6),top:4,bottom:H-10}}
function speedFor(type,val){
  // px/second. Faster than V0.1, but still designed for slower hands.
  if(type==='gold') return 72+Math.random()*14;
  if(type==='silver') return 66+Math.random()*12;
  if(val===10) return 82+Math.random()*18;
  if(val===5) return 76+Math.random()*16;
  if(val===3) return 70+Math.random()*14;
  return 62+Math.random()*14;
}
function spawn(force=false){
  if(!running)return;if(balls.length>=13&&!force)return;
  const {H,right}=bounds();
  const b=document.createElement('div');b.className='balloon';
  let type='score',label,val=0;const r=Math.random();
  if(r<.08){type='gold';b.classList.add('gold');label='🔫 ?'}
  else if(r<.12){type='silver';b.classList.add('silver');label='⏱ +3'}
  else{val=values[Math.floor(Math.random()*values.length)];b.classList.add(colors[Math.floor(Math.random()*colors.length)]);label='+'+val}
  b.innerHTML='<span>'+label+'</span>';g.appendChild(b);
  const bw=b.offsetWidth||76,bh=b.offsetHeight||72;
  let side=Math.floor(Math.random()*4),x,y,vx=0,vy=0,s=speedFor(type,val);
  const yMin=34,yMax=Math.max(100,H-bh-24),xMin=0,xMax=Math.max(70,right-bw);
  // Spawn outside one edge and always give the balloon a real travel direction.
  if(side===0){x=-bw-6;y=yMin+Math.random()*(yMax-yMin);vx=s;vy=(Math.random()-.5)*18}
  else if(side===1){x=right+8;y=yMin+Math.random()*(yMax-yMin);vx=-s;vy=(Math.random()-.5)*18}
  else if(side===2){x=Math.random()*xMax;y=-bh-8;vy=s;vx=(Math.random()-.5)*18}
  else{x=Math.random()*xMax;y=H+8;vy=-s;vx=(Math.random()-.5)*18}
  // Avoid sending balls almost straight into the legend-side boundary.
  if(Math.abs(vx)<6 && side>=2) vx=(Math.random()<.5?-1:1)*(7+Math.random()*8);
  if(Math.abs(vy)<6 && side<2) vy=(Math.random()<.5?-1:1)*(7+Math.random()*8);
  const obj={b,type,val,dead:false,x,y,vx,vy,phase:Math.random()*Math.PI*2,wobble:3+Math.random()*4};
  b.style.transform=`translate3d(${x}px,${y}px,0)`;balls.push(obj);
  b.addEventListener('pointerdown',e=>{e.preventDefault();shoot(obj,e.clientX,e.clientY)});
}
function remove(o){if(o.dead)return;o.dead=true;o.b.remove();balls=balls.filter(x=>x!==o)}
function motion(ts){
  if(!running)return;const dt=Math.min(.034,(ts-(lastTs||ts))/1000);lastTs=ts;const {H,right}=bounds();
  for(const o of [...balls]){
    if(o.dead)continue;
    o.phase+=dt*2.1;
    o.x+=o.vx*dt;o.y+=o.vy*dt;
    // Soft vertical steering keeps drifting natural without ever stopping.
    const drawY=o.y+Math.sin(o.phase)*o.wobble;
    o.b.style.transform=`translate3d(${o.x}px,${drawY}px,0)`;
    const bw=o.b.offsetWidth||76,bh=o.b.offsetHeight||72;
    if(o.x<-bw-28||o.x>right+32||o.y<-bh-32||o.y>H+32) remove(o);
  }
  raf=requestAnimationFrame(motion);
}
function shoot(o,cx,cy){
  if(!running||o.dead||ammo<=0)return;shots++;ammo--;hits++;let text='';
  if(o.type==='score'){score+=o.val;text='+'+o.val}
  else if(o.type==='gold'){if(Math.random()<.5){ammo+=2;text='🔫 +2';note('補到 2 發子彈！')}else{text='💨 空包';note('空包！')}}
  else{time+=3;text='⏱ +3';note('時間 +3 秒！')}
  const rect=g.getBoundingClientRect(),p=document.createElement('div');p.className='pop';p.textContent=text;p.style.left=(cx-rect.left-20)+'px';p.style.top=(cy-rect.top-20)+'px';g.appendChild(p);setTimeout(()=>p.remove(),750);remove(o);hud();if(ammo<=0)note('子彈用完，等時間結束')
}
function begin(){
  balls.forEach(remove);score=0;time=60;ammo=20;shots=hits=0;running=true;lastTs=0;hud();
  document.getElementById('start').style.display='none';document.getElementById('end').classList.remove('show');
  for(let i=0;i<8;i++)setTimeout(()=>spawn(true),i*180);
  clearInterval(timer);clearInterval(spawnTimer);cancelAnimationFrame(raf);raf=requestAnimationFrame(motion);
  timer=setInterval(()=>{time--;hud();if(time<=0)finish()},1000);
  spawnTimer=setInterval(()=>{if(!running)return;if(balls.length<8){spawn();setTimeout(()=>spawn(),120)}else if(balls.length<11){if(Math.random()<.92)spawn()}else if(balls.length<13&&Math.random()<.48)spawn()},430);
}
function finish(){
  if(!running)return;running=false;clearInterval(timer);clearInterval(spawnTimer);cancelAnimationFrame(raf);balls.forEach(remove);
  document.getElementById('final').textContent=score;document.getElementById('stats').textContent=`射擊 ${shots} 發｜命中 ${hits} 顆｜剩餘子彈 ${ammo}`;document.getElementById('end').classList.add('show')
}
document.getElementById('go').onclick=begin;document.getElementById('again').onclick=begin;hud();
})();
</script>

<audio id="balloonBgm" src="./leberch-whimsical-250869.mp3" preload="auto" loop></audio>
<script id="balloonBgmBridge">
(() => {
  const KEY_TIME = 'balloonBgmTime';
  const KEY_ON = 'balloonBgmOn';
  const bgm = document.getElementById('balloonBgm');
  if (!bgm) return;

  bgm.volume = 0.42;

  const saved = Number(sessionStorage.getItem(KEY_TIME));
  if (Number.isFinite(saved) && saved >= 0) {
    const restore = () => {
      const duration = Number.isFinite(bgm.duration) && bgm.duration > 0 ? bgm.duration : 95;
      bgm.currentTime = saved % duration;
    };
    if (bgm.readyState >= 1) restore();
    else bgm.addEventListener('loadedmetadata', restore, {once:true});
  }

  function markOn() {
    sessionStorage.setItem(KEY_ON, '1');
  }

  function saveTime() {
    if (Number.isFinite(bgm.currentTime)) {
      sessionStorage.setItem(KEY_TIME, String(bgm.currentTime));
      markOn();
    }
  }

  function playBgm() {
    markOn();
    const p = bgm.play();
    if (p && typeof p.catch === 'function') p.catch(() => {});
  }

  playBgm();

  const unlock = () => {
    playBgm();
    document.removeEventListener('pointerdown', unlock, true);
    document.removeEventListener('touchstart', unlock, true);
  };
  document.addEventListener('pointerdown', unlock, true);
  document.addEventListener('touchstart', unlock, {capture:true, passive:true});

  const saver = setInterval(saveTime, 250);
  window.addEventListener('pagehide', () => {
    saveTime();
    clearInterval(saver);
  });

  window.stopBalloonBgmForLobby = () => {
    saveTime();
    bgm.pause();
    sessionStorage.removeItem(KEY_TIME);
    sessionStorage.removeItem(KEY_ON);
  };
})();
</script>

</body>
</html>
